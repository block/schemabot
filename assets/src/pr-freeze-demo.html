<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="pr-workflow-comments.css"><link rel="stylesheet" href="pr-workflow-demo.css"></head><body>
<div class="repo"><svg width="17" height="18" viewBox="0 0 16 16" fill="#59636e"><path d="M2 1h11v14H2V1zm1 1v9h9V2H3zm0 10v2h9v-2H3z"/></svg><span>example / <b>shop</b></span><span class="pill">Public</span><span class="right">Code　 Issues　 <b>Pull requests</b>　 Actions</span></div>
<div class="page" id="page"><div id="scroll-content"><div class="prhead"><h1>Add a status index to orders <span>#42</span></h1><div class="meta"><span class="state" id="state">Open</span><span id="prmeta"><b>octocat</b> wants to merge 1 commit into <code>main</code> from <code>add-order-status-index</code></span></div><div class="tabs"><span class="selected"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2 2h10v8H7l-3 3v-3H2z"/><path d="M13 5h2v8h-2v2l-2-2H8"/></svg>Conversation <i class="counter">11</i></span><span><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M1 8h4m6 0h4"/></svg>Commits <i class="counter">1</i></span><span><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M7 13H2V1h9v5M5 4h3M5 7h2m2 4 2 2 4-4"/></svg>Checks <i class="counter">2</i></span><span><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 1h7l3 3v11H3zM10 1v4h3M5 9h6M8 6v6"/></svg>Files changed <i class="counter">1</i></span></div></div>
<div class="content" id="conversation"><div class="tl" id="timeline"></div><div id="checks" class="checks"></div></div></div>
</div>
<div class="footer" id="footer">Illustrative workflow using rendered comment templates · production is frozen</div>
<script src="pr-multi-target-comments.js"></script><script>
// The author asks for an override of the freeze: the freeze refuses the apply,
// the apply comment says it did not run, and the refusal names the override
// request. A second person, a freeze approver, approves it, and the author's
// next apply runs.
const S=COMMENTS.freeze,clamp=x=>Math.max(0,Math.min(1,x));
const people={
 bot:{name:'schemabot',label:'bot',avatar:'<img class="av" src="../schemabot-avatar-200.png">'},
 author:{name:'octocat',label:'Author',avatar:'<img class="av h" src="../octocat-avatar-200.png">'},
 approver:{name:S.approver,label:'Member',avatar:`<div class="av h" style="background:#ddf4ff;color:#0969da;font-weight:600;font-size:18px">${S.approver[0].toUpperCase()}</div>`},
};
function card(id,body,who='bot'){const p=people[who];return `<div class="c" id="${id}">${p.avatar}<div class="hd"><b>${p.name}</b> commented <span>now</span><span class="lbl ${who==='bot'?'bot':''}">${p.label}</span><span class="more">···</span></div><div class="bd" id="${id}-body">${body}</div></div>`}
document.getElementById('timeline').innerHTML=card('plan',S.plan)+card('command','','author')+card('apply',S.apply)+card('refusal',S.refusal)+
 card('approve','','approver')+card('approved',S.approved)+card('command2','','author')+card('apply2',S.apply)+card('progress',S.progress[0])+card('summary',S.summary);
// [card, shown at, typed command, posted at]
const typedCommands=[['command',1,S.command,4.5],['approve',13,S.approve,16.5],['command2',21,S.rerun,24]];
const shownAt={command:1,apply:5,refusal:6.5,approve:13,approved:17.5,command2:21,apply2:24.5,progress:25.5,summary:36.5};
const refusedAt=6.5,approvedAt=17.5,finishedAt=37;
let previousScroll=0,appliedScroll=0,scrollAdjust=0;
function setHTML(el,html){if(el.dataset.renderedHtml!==html){el.innerHTML=html;el.dataset.renderedHtml=html;}}
function typeCommand(id,start,text,postedAt,t){
 const body=document.getElementById(id+'-body');
 if(t<postedAt){const typed=text.slice(0,Math.floor(clamp((t-start-0.5)/2.2)*text.length));setHTML(body,`<div class="editor-tabs"><b>Write</b><span class="tiny">Preview</span></div><div class="editor">${typed}<span class="caret" style="opacity:${Math.floor(t*2)%2}"> </span></div><div class="editor-foot"><span>Markdown is supported</span><button class="btn ${t>postedAt-0.2?'pressed':''}">Comment</button></div>`);body.style.padding='0'}
 else {body.style.padding='16px';setHTML(body,`<p>${text}</p>${t>=postedAt+0.5?'<span class="rx"><span>👀 1</span></span>':''}`)}
}
window.renderFrame=function(t,frameSeconds=1/12){
 const page=document.getElementById('page'),content=document.getElementById('scroll-content');
 for(const [id,start] of Object.entries(shownAt))document.getElementById(id).classList.toggle('hidden',t<start);
 for(const [id,start,text,postedAt] of typedCommands)typeCommand(id,start,text,postedAt,t);
 setHTML(document.getElementById('apply-body'),t>=refusedAt?S.refused:S.apply);
 setHTML(document.getElementById('progress-body'),t>=35.5?S.complete:S.progress[Math.min(S.progress.length-1,Math.max(0,Math.floor(t-shownAt.progress)))]);
 setHTML(document.getElementById('footer'),'Illustrative workflow using rendered comment templates · '+(t<approvedAt?'production is frozen':'production is frozen · a second person approved the override'));
 const finished=t>=finishedAt,active=!finished;
 const checkHeading=finished?'All checks have passed':'Some checks haven’t completed yet';
 const checksBody=finished?'<div class="check-group">2 successful checks ⌄</div>':'<div class="check-group">1 pending check ⌄<span class="check-settings">⚙</span></div>';
 const running=t>=shownAt.apply2&&!finished;
 const engineRow=`<div class="check-entry"><span class="${finished?'ok':'pending-icon'}">${finished?'✓':'<svg class="ui-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M7.2 1.5a.9.9 0 0 1 1.6 0l6.9 12a1 1 0 0 1-.8 1.5H1.1a1 1 0 0 1-.8-1.5z"/><path d="M8 5v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".8" fill="white"/></svg>'}</span><img src="../schemabot-avatar-200.png" width="20" height="20"><span>SchemaBot (production)</span><span class="check-description">— ${finished?'All applies complete':running?'Apply in progress':'1 apply pending'}</span><span class="required-badge">Required</span><span class="check-menu">···</span></div>`;
 const mergeRow=active?'<div class="merge-controls"><button class="btn" disabled style="background:#f6f8fa;color:#8c959f">Merge pull request</button><span class="tiny">Merging is blocked</span></div>':t<39.2?`<div class="merge-controls"><span class="ok">✓</span><span>This branch has no conflicts with the base branch</span><button class="btn" id="merge">${t>=38.3?'Confirm merge':'Merge pull request'}</button></div>`:'<div class="merge-controls mergedrow"><span class="mergedicon"><svg viewBox="0 0 16 16" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4" cy="3" r="2"/><circle cx="4" cy="13" r="2"/><circle cx="12" cy="9" r="2"/><path d="M4 5v6m0-6c0 4 4 4 6 4"/></svg></span><div><b>Pull request successfully merged and closed</b><br><span class="tiny">You’re all set — the <code>add-order-status-index</code> branch can be safely deleted.</span></div><button class="quiet">Delete branch</button></div>';
 setHTML(document.getElementById('checks'),`<div class="check-summary"><span class="check-ring ${finished?'passed':''}"></span><div><b>${checkHeading}</b><div class="check-description">${finished?'2 successful checks':'1 pending, 1 successful check'}</div></div><span class="check-chevron">⌄</span></div><div class="check-details">${checksBody}${engineRow}${finished?'<div class="check-entry"><span class="ok">✓</span><span>ci / test</span><span class="check-description">— Successful</span></div>':'<div class="check-group successful-group">1 successful check ⌄</div>'}</div>${mergeRow}`);
 const merged=t>=39.2;
 const state=document.getElementById('state');state.textContent=merged?'Merged':'Open';state.style.background=merged?'#8250df':'#1f883d';
 setHTML(document.getElementById('prmeta'),merged?'<b>octocat</b> merged 1 commit into <code>main</code> from <code>add-order-status-index</code>':'<b>octocat</b> wants to merge 1 commit into <code>main</code> from <code>add-order-status-index</code>');
 const target=t<1?'plan':t<5?'command':t<6.5?'apply':t<13?'refusal':t<17.5?'approve':t<21?'approved':t<24.5?'command2':t<25.5?'apply2':t<36.5?'progress':t<38.5?'summary':'checks';
 const el=document.getElementById(target),r=el.getBoundingClientRect(),vr=page.getBoundingClientRect();
 let desired=Math.min(Math.max(0,content.offsetHeight+64-page.clientHeight),Math.max(0,appliedScroll+r.top-vr.top-20));
 desired=Math.max(previousScroll,desired);
 // Smooth camera motion, like scrolling a real conversation; retain the thread.
 const scrollStep=(desired-previousScroll)*(1-Math.pow(0.72,frameSeconds*12));
 previousScroll+=Math.max(-500*frameSeconds,Math.min(500*frameSeconds,scrollStep));
 if(Math.abs(desired-previousScroll)<1)previousScroll=desired;
 page.scrollTop=0;
 appliedScroll=Math.round(previousScroll);
 content.style.transform=`translateY(${-appliedScroll}px)`;
};
window.renderFrame(0);
</script></body></html>
