<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Spirit slows the copy when commit latency passes 100ms</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}text{font-variant-numeric:tabular-nums}.mono{font-family:SFMono-Regular,Menlo,Consolas,monospace}</style>
<svg id="art" width="1100" height="690" viewBox="0 0 1100 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An application and Spirit's copy share an Aurora writer; as application traffic grows, average commit latency climbs past 100ms, Spirit waits before each chunk so the copy slows, and the copy resumes once latency recovers"></svg>
<script>
const C={ink:'#1f2328',muted:'#59636e',line:'#d1d9e0',soft:'#f6f8fa',blue:'#0969da',blueBg:'#ddf4ff',green:'#1a7f37',greenBg:'#dafbe1',amber:'#9a6700',amberBg:'#fff8c5',purple:'#8250df',purpleBg:'#fbefff',red:'#cf222e',redBg:'#ffebe9'};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const rect=(x,y,w,h,fill=C.soft,stroke='none',r=8,dash='')=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-dasharray="${dash}"/>`;
const txt=(x,y,s,size=16,color=C.ink,weight=400,cls='',anchor='start')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="${weight}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const line=(x1,y1,x2,y2,color=C.line,w=1,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-dasharray="${dash}"/>`;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x);},frac=x=>x-Math.floor(x);
const DURATION=20,THRESHOLD=100;
// Application traffic grows, holds, then falls back.
const appLoad=t=>1+1.6*ease((t-5)/4)-1.6*ease((t-14)/3);
// Average commit latency in ms follows the application's load.
function latency(t){
 const wobble=2.5*Math.sin(t*1.3);
 if(t<5.5)return 38+wobble;
 if(t<14)return 38+74*ease((t-5.5)/5)+wobble;
 return 112-74*ease((t-14)/3.5)+wobble;
}
const sampled=t=>latency(Math.floor(t*2)/2);
const throttledAt=t=>sampled(t)>=THRESHOLD;
const progress=[];{let p=.18;for(let i=0;i<=DURATION*20;i++){progress.push(p);if(!throttledAt(i/20))p+=.012/20;}}
const PX0=56,PX1=1044,PY0=540,PY1=420,YMAX=130;
const px=t=>PX0+(PX1-PX0)*t/DURATION,py=ms=>PY0-(PY0-PY1)*Math.min(ms,YMAX)/YMAX;
function flow(x0,x1,y,n,speed,t,color){let r='';for(let k=0;k<n;k++){const u=frac(t*speed+k/n);r+=`<circle cx="${x0+(x1-x0)*u}" cy="${y}" r="4" fill="${color}"/>`;}return r;}
function arrow(x0,x1,y,color){const d=Math.sign(x1-x0);return line(x0,y,x1,y,color,2)+`<path d="M${x1} ${y} L${x1-9*d} ${y-6} L${x1-9*d} ${y+6} Z" fill="${color}"/>`;}
function renderFrame(t){
 t=Math.max(0,Math.min(t,DURATION-.05));
 const phase=Math.min(3,Math.floor(t/5)),lat=sampled(t),throttled=throttledAt(t),hot=lat>=THRESHOLD,load=appLoad(t);
 const labels=['Copy beside the app','App traffic grows','Copy waits','Copy resumes'];
 const captions=['Spirit copies the table while the application keeps writing to the same database.',
  'More application writes slow each commit, and average commit latency climbs past 100ms.',
  'Spirit waits before each chunk, so the copy slows and leaves the database to the application.',
  'Commit latency falls back under 100ms, so the copy picks up speed on its own.'];
 let s=rect(0,0,1100,690,'#fff','none',0)+txt(36,37,'SCHEMABOT / SPIRIT',13,C.muted,650)+txt(36,105,'Spirit slows the copy when commit latency passes 100ms.',32,C.ink,650);
 for(let i=0;i<4;i++){const x=36+i*263;s+=rect(x,130,247,3,i<phase?C.green:i===phase?C.blue:C.line)+txt(x,158,labels[i],16,i===phase?C.blue:C.muted,i===phase?650:500);}
 // The application and Spirit both write to one Aurora writer.
 s+=rect(36,190,260,150,'#fff',C.line,12)+txt(56,224,'Application',20,C.ink,650)+txt(56,262,'writes per second',13,C.muted,600)+txt(56,306,(1.2*load).toFixed(1)+'k',34,C.blue,650,'mono');
 s+=rect(380,190,340,150,'#fff',hot?C.red:C.line,12)+txt(400,224,'Aurora writer',20,C.ink,650)+txt(400,262,'average commit latency',13,C.muted,600)+txt(400,306,lat.toFixed(1)+'ms',34,hot?C.red:C.ink,650,'mono');
 s+=rect(804,190,260,150,'#fff',throttled?C.amber:C.line,12)+txt(824,224,'Spirit copy',20,C.ink,650)+txt(824,262,'rows per second',13,C.muted,600)+txt(824,306,throttled?'0':'42,000',34,throttled?C.amber:C.purple,650,'mono');
 const p=progress[Math.round(t*20)];
 s+=txt(824,328,'orders',12,C.muted,600,'mono')+rect(876,319,140,8,C.soft,'none',4)+rect(876,319,140*p,8,throttled?C.amber:C.purple,'none',4)+txt(1044,328,Math.floor(p*100)+'%',12,C.ink,600,'mono','end');
 s+=arrow(300,372,265,C.blue)+flow(304,362,265,Math.round(2+2*load),.9,t,C.blue);
 s+=arrow(800,728,265,throttled?C.line:C.purple)+(throttled?'':flow(796,738,265,3,.9,t,C.purple));
 // Commit latency over time against the throttle threshold.
 s+=rect(36,360,1028,196,'#fff',C.line,12)+txt(56,392,'Average commit latency',15,C.ink,650);
 s+=txt(1044,392,throttled?'(throttled) commit-latency '+lat.toFixed(1)+'ms >= '+THRESHOLD+'ms':'copying chunks',13,throttled?C.amber:C.purple,650,'mono','end');
 for(let a=0;a<t;a+=.5){const b=Math.min(t,a+.5);if(throttledAt(a))s+=rect(px(a),PY1-8,px(b)-px(a),PY0-PY1+8,C.amberBg,'none',0);}
 s+=line(PX0,PY0,PX1,PY0,C.line)+line(PX0,py(THRESHOLD),PX1,py(THRESHOLD),C.red,1.5,'6 4')+txt(PX1,py(THRESHOLD)-6,'throttle at 100ms',12,C.red,650,'','end');
 let pts=[];for(let a=0;a<=t;a+=.1)pts.push(px(a).toFixed(1)+','+py(latency(a)).toFixed(1));pts.push(px(t).toFixed(1)+','+py(latency(t)).toFixed(1));
 s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${hot?C.red:C.blue}" stroke-width="3" stroke-linejoin="round"/>`+`<circle cx="${px(t)}" cy="${py(latency(t))}" r="5" fill="${hot?C.red:C.blue}"/>`;
 s+=rect(36,576,1028,57,C.soft)+txt(55,612,captions[phase],17,C.ink,500);
 s+=txt(36,659,'Illustrative timing · Spirit averages commit latency over five-second samples and rechecks every second while it waits.',12,C.muted);
 s+=txt(36,678,'On Aurora, Spirit also counts threads on CPU; the MySQL guide explains each throttle signal.',12,C.muted);
 document.getElementById('art').innerHTML=s;return {phase,lat,throttled};
}
window.renderFrame=renderFrame;renderFrame(0);
</script></html>
