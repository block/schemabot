<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Spirit adapts the copy to the database's load</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}text{font-variant-numeric:tabular-nums}.mono{font-family:SFMono-Regular,Menlo,Consolas,monospace}</style>
<svg id="art" width="1100" height="690" viewBox="0 0 1100 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spirit adds write threads while the database has headroom, holds inside a target band, sheds threads as application load rises, and pauses the copy at the throttle limit until the load clears"></svg>
<script>
const C={ink:'#1f2328',muted:'#59636e',line:'#d1d9e0',soft:'#f6f8fa',blue:'#0969da',blueBg:'#ddf4ff',green:'#1a7f37',greenBg:'#dafbe1',amber:'#9a6700',amberBg:'#fff8c5',purple:'#8250df',purpleBg:'#fbefff',red:'#cf222e',redBg:'#ffebe9'};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const rect=(x,y,w,h,fill=C.soft,stroke='none',r=8)=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;
const txt=(x,y,s,size=16,color=C.ink,weight=400,cls='',anchor='start')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="${weight}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const line=(x1,y1,x2,y2,color=C.line,w=1,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-dasharray="${dash}"/>`;
// Application load over the loop, as a fraction of the throttle limit.
const appKeys=[[0,.10],[5,.10],[6,.12],[11,.22],[12,.26],[13,.42],[14,.46],[15,.50],[18,.52],[18.6,.97],[20.6,.98],[21,.40],[22.5,.14],[24,.10]];
function appLoad(t){for(let i=1;i<appKeys.length;i++){const [a,va]=appKeys[i-1],[b,vb]=appKeys[i];if(t<=b)return va+(vb-va)*(t-a)/(b-a);}return appKeys.at(-1)[1];}
// Spirit's control law, one decision per tick against the load it reads:
// below the band add a thread, inside it hold, above it shed one, and at the
// limit halve. Each write thread adds a share of the load.
const perThread=.05,low=.4,high=.7,limit=1;
const ticks=[];
{let threads=3;for(let k=0;k<24;k++){const load=appLoad(k)+perThread*threads;let act='hold';
 if(load>=limit){act='halve';threads=Math.max(1,Math.floor(threads/2));}
 else if(load>=high){act='shed';threads=Math.max(1,threads-1);}
 else if(load<low){act='add';threads+=1;}
 ticks.push({act,threads});}}
const threadsAt=t=>ticks[Math.min(23,Math.floor(t))].threads;
const loadAt=t=>appLoad(t)+perThread*threadsAt(t);
// The copy advances in proportion to its threads, and not at all while paused.
const progress=[];{let p=.18;for(let i=0;i<=480;i++){progress.push(p);const t=i/20;if(loadAt(t)<limit)p+=.0042*threadsAt(t)/20;}}
const PX0=96,PX1=652,PY0=530,SCALE=240;
const px=t=>PX0+(PX1-PX0)*t/24,py=v=>PY0-SCALE*v;
function area(t1,lower,upper){
 const pts=[];for(let t=0;t<=t1+1e-9;t+=.1)pts.push([px(t),py(upper(t))]);
 const back=[];for(let t=Math.min(t1,Math.floor(t1*10)/10);t>=-1e-9;t-=.1)back.push([px(t),py(lower(t))]);
 return pts.concat(back).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z';
}
function topLine(t1,upper){const pts=[];for(let t=0;t<=t1+1e-9;t+=.1)pts.push((pts.length?'L':'M')+px(t).toFixed(1)+' '+py(upper(t)).toFixed(1));return pts.join(' ');}
function renderFrame(t){
 t=Math.max(0,Math.min(t,23.95));
 const phase=Math.min(3,Math.floor(t/6)),tick=ticks[Math.floor(t)],threads=threadsAt(t),load=loadAt(t),paused=load>=limit;
 const resumed=phase===3&&t>=21;
 const labels=['Add while there is room','Hold inside the band','Shed as traffic rises','Pause at the limit'];
 const captions=['The database has room to spare, so Spirit adds write threads and the copy speeds up.',
  'Load sits inside the target band, so Spirit holds its thread count steady.',
  'Application traffic rises, so Spirit sheds threads to leave the database room.',
  resumed?'The load clears; the copy resumes on its own and climbs back.':'Load crosses the limit; the copy pauses and Spirit halves its threads.'];
 let s=rect(0,0,1100,690,'#fff','none',0)+txt(36,37,'SCHEMABOT / SPIRIT',13,C.muted,650)+txt(36,105,'The copy runs as fast as the database allows.',32,C.ink,650);
 for(let i=0;i<4;i++){const x=36+i*263;s+=rect(x,130,247,3,i<phase?C.green:i===phase?C.blue:C.line)+txt(x,158,labels[i],16,i===phase?C.blue:C.muted,i===phase?650:500);}
 // Load chart: the application's share and the copy's share stack against the limit.
 s+=rect(36,190,640,366,'#fff',C.line,12)+txt(56,224,'Database load',20,C.ink,650);
 s+=rect(420,212,12,12,C.blueBg,C.blue,3)+txt(438,223,'Application',13,C.muted)+rect(530,212,12,12,C.purpleBg,C.purple,3)+txt(548,223,'Spirit copy',13,C.muted);
 const bands=[[0,low,C.greenBg,'add',C.green],[low,high,C.soft,'hold',C.muted],[high,limit,C.amberBg,'shed',C.amber],[limit,1.15,C.redBg,'pause',C.red]];
 for(const [a,b,fill,name,color] of bands){s+=`<rect x="${PX0}" y="${py(b)}" width="${PX1-PX0}" height="${py(a)-py(b)}" fill="${fill}"/>`+txt(PX0-10,(py(a)+py(b))/2+4,name,12,color,600,'','end');}
 s+=`<path d="${area(t,()=>0,appLoad)}" fill="${C.blueBg}" stroke="none"/>`+`<path d="${area(t,appLoad,loadAt)}" fill="${C.purpleBg}" stroke="none"/>`;
 s+=`<path d="${topLine(t,appLoad)}" fill="none" stroke="${C.blue}" stroke-width="2"/>`+`<path d="${topLine(t,loadAt)}" fill="none" stroke="${C.purple}" stroke-width="2.5"/>`;
 s+=line(PX0,py(limit),PX1,py(limit),C.red,1.5,'6 4')+txt(PX0+8,py(limit)-7,'throttle limit',12,C.red,600);
 s+=line(PX0,PY0,PX1,PY0,C.line,1);
 s+=line(px(t),py(1.15),px(t),PY0,C.muted,1,'2 3')+`<circle cx="${px(t)}" cy="${py(load)}" r="5" fill="${paused?C.red:C.purple}"/>`;
 // Spirit's write pool and what SchemaBot reports for the table.
 s+=rect(696,190,368,366,'#fff',paused?C.red:C.line,12)+txt(716,226,'Spirit',23,C.ink,650)+txt(716,248,'Online copy engine',13,C.muted);
 s+=txt(716,286,'Write threads',15,C.ink,600)+txt(1044,286,String(threads),17,C.purple,650,'mono','end');
 for(let i=0;i<8;i++){const x=716+i*41;s+=rect(x,298,34,30,i<threads?C.purple:C.soft,i<threads?'none':C.line,5);}
 const acts={add:['Room to spare · add a thread',C.green,C.greenBg],hold:['Inside the band · hold',C.muted,C.soft],shed:['Load rising · shed a thread',C.amber,C.amberBg],halve:['Over the limit · halve and pause',C.red,C.redBg]};
 const [actText,actColor,actFill]=acts[tick.act];
 s+=rect(716,344,328,34,actFill,'none',6)+txt(730,366,actText,14,actColor,600);
 s+=line(716,400,1044,400,C.line,1)+txt(716,428,'SchemaBot progress',13,C.muted,600);
 const p=progress[Math.round(t*20)];
 s+=txt(716,458,'orders',15,C.ink,600,'mono')+rect(792,447,180,10,C.soft,'none',4)+rect(792,447,180*p,10,C.blue,'none',4)+txt(1044,458,Math.floor(p*100)+'%',15,C.ink,600,'mono','end');
 if(paused){s+=txt(716,490,'(throttled)',14,C.amber,650,'mono')+txt(716,514,'Throttled: redo-aware 19 > 17',13,C.ink,500,'mono')+txt(716,536,'active threads exceed the budget',12,C.muted);}
 else{s+=txt(716,490,'copying',14,C.blue,600,'mono')+txt(716,514,threads+' write '+(threads===1?'thread':'threads'),13,C.muted,500,'mono');}
 s+=rect(36,576,1028,57,C.soft)+txt(55,612,captions[phase],17,C.ink,500);
 s+=txt(36,659,'Illustrative load and timing · The pause lifts on its own when the signal clears; no one has to resume the copy.',12,C.muted);
 s+=txt(36,678,'A larger instance raises the limit, which leaves the copy more room alongside the application.',12,C.muted);
 document.getElementById('art').innerHTML=s;return {phase,threads,load,paused};
}
window.renderFrame=renderFrame;renderFrame(0);
</script></html>
