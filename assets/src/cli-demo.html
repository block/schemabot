<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SchemaBot CLI scenarios</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:1100px;height:670px}header{height:100px;padding:24px 34px;background:#f6f8fa;border-bottom:1px solid #d1d9e0}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 9px;font-weight:600}header p{font-size:14px;margin:0;color:#59636e}.terminal{margin:24px 34px;border:1px solid #d1d9e0;border-radius:8px;height:474px;overflow:hidden}.bar{height:37px;background:#f6f8fa;border-bottom:1px solid #d1d9e0;padding:10px 19px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#59636e}.screen{padding:22px 20px;font:15px/23px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}.command{color:#0969da;font-weight:600;height:35px}#output{margin:0;font:inherit}footer{position:absolute;bottom:22px;left:34px;right:34px;display:flex;justify-content:space-between;font-size:12px;color:#59636e}#caption{color:#1f2328;font-weight:500}.line{position:absolute;bottom:0;height:3px;background:#0969da;left:0}
</style></head><body><header><h1 id="title"></h1><p>SchemaBot CLI · fictional scenarios rendered with the production templates</p></header><main class="terminal"><div class="bar">shop · staging</div><div class="screen"><div class="command" id="command"></div><pre id="output"></pre></div></main><footer><span id="caption"></span><span>Illustrative timing · selected moments</span></footer><div class="line" id="line"></div><script>
let demo,timeline,total;
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const colors={30:'#1f2328',31:'#cf222e',32:'#1a7f37',33:'#9a6700',34:'#0969da',35:'#8250df',36:'#0550ae',37:'#59636e',90:'#59636e',91:'#cf222e',92:'#1a7f37',93:'#9a6700',94:'#0969da',95:'#8250df',96:'#0550ae'};
function ansi(raw){raw=raw.replace(/\x1b\]8;[^\x07]*(?:\x07)/g,'');let out='',last=0,style={},m;const re=/\x1b\[([0-9;]*)m/g;const span=s=>'<span style="'+Object.entries(style).map(([k,v])=>k+':'+v).join(';')+'">'+escape(s)+'</span>';while((m=re.exec(raw))){out+=span(raw.slice(last,m.index));const codes=m[1].split(';').map(Number);for(let i=0;i<codes.length;i++){const c=codes[i];if(c===0)style={};else if(c===1)style['font-weight']='600';else if(c===2)style.color='#59636e';else if(c===22)delete style['font-weight'];else if(c===39)delete style.color;else if(colors[c])style.color=colors[c];else if(c===38&&codes[i+1]===2){style.color=`rgb(${codes.slice(i+2,i+5).join(',')})`;i+=4;}}last=re.lastIndex;}return out+span(raw.slice(last));}
window.setDemo=d=>{demo=d;document.querySelector('.bar').textContent=d.name==='cli-fleet'?'fleet · staging':'shop · staging';document.querySelector('#title').textContent=d.title;let time=0,command='',caption='';timeline=d.frames.map(f=>{const typing=f.command&&f.command!==command?1.4:0;command=f.command||command;caption=f.caption||caption;const frame={...f,start:time,typing,command,caption};time+=typing+f.seconds;return frame;});total=time;return total;};
window.renderFrame=t=>{const f=timeline.find((f,i)=>t>=f.start&&(i===timeline.length-1||t<timeline[i+1].start))||timeline[0];const elapsed=t-f.start;const typing=elapsed<f.typing;document.querySelector('#command').textContent='$ '+(typing?f.command.slice(0,Math.floor(elapsed/f.typing*f.command.length))+'▌':f.command);document.querySelector('#output').innerHTML=typing?'':ansi(f.output.trimEnd());document.querySelector('#caption').textContent=f.caption;document.querySelector('#line').style.width=(Math.min(t/total,1)*1100)+'px';const pre=document.querySelector('#output');return {overflow:pre.scrollWidth>1000||pre.scrollHeight>365};};
</script></body></html>
