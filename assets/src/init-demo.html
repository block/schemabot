<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1100px;height:820px;background:#fff;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.header{height:104px;padding:23px 36px;border-bottom:1px solid #d1d9e0;background:#f6f8fa;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 7px;font-weight:600}.sub{font-size:14px;color:#59636e}.badge{font-size:13px;border:1px solid #d1d9e0;background:white;border-radius:18px;padding:7px 13px}.steps{display:flex;gap:26px;padding:19px 36px 17px;color:#59636e;font-size:14px}.step{display:flex;gap:8px;align-items:center}.number{border:1px solid #d1d9e0;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px}.active{color:#0969da;font-weight:600}.active .number{background:#ddf4ff;border-color:#54aeff}.done{color:#1a7f37}.done .number{background:#dafbe1;border-color:#aceebb}.window{margin:0 36px;border:1px solid #d1d9e0;border-radius:8px;overflow:hidden;background:white;height:593px}.bar{height:40px;background:#f6f8fa;border-bottom:1px solid #d1d9e0;padding:11px 17px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#59636e;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;background:#d1d9e0;border-radius:50%}.bar span:last-child{margin-left:10px}.viewport{height:551px;overflow:hidden;padding:21px 24px}.content{font:16px/21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-wrap:normal;will-change:transform}.cmd{color:#0969da;font-weight:600}.ok{color:#1a7f37;font-weight:600}.muted{color:#59636e}.add{background:#dafbe1;color:#116329}.remove{background:#ffebe9;color:#82071e}.footer{position:absolute;left:36px;bottom:22px;right:36px;display:flex;justify-content:space-between;color:#59636e;font-size:12px}.progress{height:3px;position:absolute;bottom:0;left:0;background:#0969da}
</style></head><body><div class="header"><div><h1>From database to first plan</h1><div class="sub">SchemaBot · MySQL · local setup</div></div><div class="badge">No application changes applied</div></div><div class="steps"><div class="step" id="s0"><span class="number">1</span>Connect</div><div class="step" id="s1"><span class="number">2</span>Edit the schema</div><div class="step" id="s2"><span class="number">3</span>Review the plan</div></div><div class="window"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="label">shop · terminal</span></div><div class="viewport"><div class="content" id="content"></div></div></div><div class="footer"><span>Recorded CLI output from disposable demo databases · pauses shortened</span><span id="caption"></span></div><div class="progress" id="progress"></div><script>
let recording,previousScroll=0;
const frameText=f=>f.rows.map(r=>r.map(s=>s.text).join('')).join('\n');
// Reading time belongs to each scene, not to how long Docker happened to take.
function pacedFrame(frames, seconds, scenes) {
 for (const [duration, matches] of scenes) {
  const candidates=frames.filter(f=>matches(frameText(f)));
  if(seconds<duration && candidates.length){
   const first=candidates[0].time,last=candidates.at(-1).time;
   const at=first+Math.min(seconds/(duration*.75),1)*(last-first);
   return candidates.filter(f=>f.time<=at).at(-1)||candidates[0];
  }
  seconds-=duration;
 }
 return frames.at(-1);
}
const clean=s=>s.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,'').replace(/\r/g,'');
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const ansi=s=>{let html='',last=0,style='';const re=/\x1b\[([0-9;]*)m/g;let m;while((m=re.exec(s))){html+='<span style="'+style+'">'+escape(s.slice(last,m.index))+'</span>';for(const code of m[1].split(';')){if(code==='0'||code==='')style='';if(code==='1')style+='font-weight:600;';if(code==='34')style+='color:#0969da;';if(code==='35')style+='color:#8250df;';}last=re.lastIndex;}return html+'<span style="'+style+'">'+escape(s.slice(last))+'</span>';};
window.setRecording=data=>{recording=data; if(data.apply_frames){document.querySelector('h1').textContent='From setup to a verified schema change';document.querySelector('.badge').textContent='Disposable '+(data.engine==='postgres'?'PostgreSQL':data.engine==='vitess'?'Vitess / PlanetScale':'MySQL')+' sample';document.querySelector('.steps').innerHTML=['Connect','Edit','Plan','Apply','Verify'].map((s,i)=>'<div class="step" id="s'+i+'"><span class="number">'+(i+1)+'</span>'+s+'</div>').join('');} document.querySelector('.sub').textContent='SchemaBot · '+(data.engine==='postgres'?'PostgreSQL':data.engine==='vitess'?'Vitess / PlanetScale':'MySQL')+' · local setup'; const first=data.wizard_frames.findIndex(f=>f.rows.some(r=>r.map(s=>s.text).join('').includes('esc cancel'))); if(first>0)recording.wizard_frames=data.wizard_frames.slice(first);};
window.renderFrame=(t,dt)=>{
 const full=!!recording.apply_frames, wizardEnd=full?9:recording.sample?17:30, editEnd=wizardEnd+(recording.sample?3:6);
 const phase=t<wizardEnd?0:t<editEnd?1:full&&t>=26?4:full&&t>=17?3:2;
 for(let i=0;i<(full?5:3);i++)document.getElementById('s'+i).className='step '+(i===phase?'active':i<phase?'done':'');
 let lines;
 if(phase===0||phase===3){
  const localTime=phase===3?t-17:t;
  const commandTime=phase===3?2:full?1:2;
  if(localTime<commandTime){document.getElementById('content').innerHTML='<div class=cmd>'+escape(('$ '+(phase===3?recording.apply_command:recording.init_command||'schemabot init')).slice(0,Math.floor(localTime*(phase===3?50:full?20:10))))+'▌</div>';document.getElementById('caption').textContent=phase===3?'Apply the change you reviewed.':'Start with schemabot init';return;}
  const frames=phase===3?recording.apply_frames:recording.wizard_frames;
  const recordedTime=Math.min(Math.max(0,localTime-2)/(phase===3?5:full?9:recording.sample?12:25),1)*frames[frames.length-1].time;
  const frame=full?pacedFrame(frames,localTime-commandTime,phase===3?[
   [3,s=>!s.includes('Applying changes')&&!s.includes('Apply complete!')],
   [1.5,s=>s.includes('Applying changes')&&!s.includes('Apply complete!')],
   [2.5,s=>s.includes('Apply complete!')]
  ]:[
   [.5,s=>s.includes('What would you like to try?')&&s.includes('› Connect my database')],
   [1,s=>s.includes('What would you like to try?')&&s.includes('› Try a sample database')],
   [.7,s=>s.includes('Choose your sample database')&&s.includes('› MySQL')],
   [1.8,s=>s.includes('Choose your sample database')&&s.includes('› PostgreSQL')],
   [1,s=>s.includes('/  sample database')],
   [.8,s=>s.includes('/  connect and verify')],
   [2.2,s=>s.includes('Your schema is ready')]
  ]):recording.engine==='vitess'?pacedFrame(frames,localTime-commandTime,[
   [1,s=>s.includes('What would you like to try?')],
   [1.5,s=>s.includes('Database engine')],
   [1,s=>s.includes('Database name')],
   [2,s=>s.includes('Connect to your Vitess database')],
   [4,s=>s.includes('Where should SchemaBot store its own data?')&&s.includes('Data stays in a Docker volume')&&s.includes('esc cancel')],
   [1.5,s=>s.includes('PlanetScale organization')],
   [4,s=>s.includes('Enter token ID and secret')&&s.includes('esc cancel')],
   [2,s=>s.includes('Token ID')&&!s.includes('Enter token ID')],
   [1,s=>s.includes('Token secret (hidden)')],
   [3,s=>s.includes('Review your setup')],
   [3,s=>s.includes('/  connect and verify')],
   [4,s=>s.includes('Your schema is ready')]
  ]):frames.filter(f=>f.time<=recordedTime).at(-1)||frames[0];
  const colors={default:'#1f2328',black:'#1f2328',red:'#cf222e',green:'#1a7f37',brown:'#9a6700',blue:'#0969da',magenta:'#8250df',cyan:'#0550ae',white:'#59636e',brightblack:'#59636e'};
  const content=document.getElementById('content');
  content.innerHTML=frame.rows.map(row=>'<div>'+row.map(span=>{
   const fg=span.style[0];const color=colors[fg]||(/^[0-9a-f]{6}$/i.test(fg)?'#'+fg:'#1f2328');
   return '<span style="color:'+color+';font-weight:'+(span.style[1]?'600':'400')+'">'+escape(span.text)+'</span>';
  }).join('')+'</div>').join('');
  content.style.transform='none';
  const screenText=frame.rows.map(r=>r.map(s=>s.text).join('')).join('\n');
  document.getElementById('caption').textContent=phase===3?'Confirm the plan, then watch the change finish.':screenText.includes('What would you like to try?')?'Connect your database or start with a local sample.':screenText.includes('/  sample database')?'Preparing your local database.':screenText.includes('Your schema is ready')?'Your baseline is verified. Ready for the first edit.':screenText.includes('/  connect and verify')?'SchemaBot imports and verifies your schema.':screenText.includes('Review your setup')?'Review your database, files, and connections.':screenText.includes('space select')?'Choose the namespaces you want to manage.':screenText.includes('Connecting and finding')?'Connect and discover what is available.':screenText.includes('✓ Connected')?'Connection verified. Setup continues automatically.':screenText.includes('Checking connection')?'Verify access with a read-only query.':screenText.includes('Where should SchemaBot store its own data?')?'Choose where SchemaBot keeps its own data.':(screenText.includes('Connect SchemaBot’s state database')||screenText.includes('Store SchemaBot’s plans and progress'))?'Confirm where SchemaBot keeps plans and progress.':screenText.includes('PlanetScale organization')?'Choose the organization that owns your database.':screenText.includes('Connect the PlanetScale API')?'Verify access to the PlanetScale API.':(screenText.includes('Connect your database')||screenText.includes('Connect to your Vitess database'))?'Confirm the host and database before connecting.':screenText.includes('Database name')?'Give your database a name.':'Choose your database engine.';
  document.getElementById('progress').style.width=((phase+1)/(full?5:3)*100)+'%';
  return;
 }else if(phase===1){
  lines=[recording.schema_file,'',...clean(recording.diff).trimEnd().split('\n').slice(2)];
  document.getElementById('caption').textContent='Give email addresses more room.';
 }else if(phase===4){
  lines=['$ '+recording.plan_command,'',...recording.clean_plan.replace(/\r/g,'').trimEnd().split('\n')];
  document.getElementById('caption').textContent='No remaining changes. The database matches your files.';
 }else{
  if(t<editEnd+(full?1:2)){lines=[('$ '+(recording.plan_command||'schemabot plan -s schema -e development')).slice(0,Math.floor((t-editEnd)*(full?50:23)))+'▌'];}else lines=['$ '+(recording.plan_command||'schemabot plan -s schema -e development'),'',...recording.plan.replace(/\r/g,'').trimEnd().split('\n')];
  document.getElementById('caption').textContent='The next change is a plan you can review.';
 }
 const html=lines.map(line=>{
 let cls='';if(line.startsWith('$ '))cls='cmd';else if(line.startsWith('+'))cls='add';else if(line.startsWith('-'))cls='remove';else if(line.includes('Baseline plan: no changes')||line.startsWith('Schema ready'))cls='ok';else if(line.startsWith('@@'))cls='muted';
 return '<div class="'+cls+'">'+(line?ansi(line):' ')+'</div>';
 }).join('');
 const content=document.getElementById('content');content.innerHTML=html;
 const wanted=phase===0?Math.max(0,content.scrollHeight-505):0;
 previousScroll+= (wanted-previousScroll)*(1-Math.pow(.65,dt*12));
 if(phase!==0)previousScroll=0;
 content.style.transform=`translateY(${-Math.round(previousScroll)}px)`;
 document.getElementById('label').textContent=phase===1?'shop · '+recording.schema_file:'shop · terminal';
 document.getElementById('progress').style.width=((phase+1)/(full?5:3)*1100)+'px';
};
</script></body></html>
