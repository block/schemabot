<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1100px;height:820px;background:#fff;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.header{height:104px;padding:23px 36px;border-bottom:1px solid #d1d9e0;background:#f6f8fa;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 7px;font-weight:600}.sub{font-size:14px;color:#59636e}.badge{font-size:13px;border:1px solid #d1d9e0;background:white;border-radius:18px;padding:7px 13px}.steps{display:flex;gap:26px;padding:19px 36px 17px;color:#59636e;font-size:14px}.step{display:flex;gap:8px;align-items:center}.number{border:1px solid #d1d9e0;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px}.active{color:#0969da;font-weight:600}.active .number{background:#ddf4ff;border-color:#54aeff}.done{color:#1a7f37}.done .number{background:#dafbe1;border-color:#aceebb}.window{margin:0 36px;border:1px solid #d1d9e0;border-radius:8px;overflow:hidden;background:white;height:593px}.bar{height:40px;background:#f6f8fa;border-bottom:1px solid #d1d9e0;padding:11px 17px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#59636e;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;background:#d1d9e0;border-radius:50%}.bar span:last-child{margin-left:10px}.viewport{height:551px;overflow:hidden;padding:21px 24px}.content{font:16px/23px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;will-change:transform}.cmd{color:#0969da;font-weight:600}.ok{color:#1a7f37;font-weight:600}.muted{color:#59636e}.add{background:#dafbe1;color:#116329}.remove{background:#ffebe9;color:#82071e}.footer{position:absolute;left:36px;bottom:22px;right:36px;display:flex;justify-content:space-between;color:#59636e;font-size:12px}.progress{height:3px;position:absolute;bottom:0;left:0;background:#0969da}
</style></head><body><div class="header"><div><h1>From database to first plan</h1><div class="sub">SchemaBot · MySQL · local setup</div></div><div class="badge">No application changes applied</div></div><div class="steps"><div class="step" id="s0"><span class="number">1</span>Connect</div><div class="step" id="s1"><span class="number">2</span>Edit the schema</div><div class="step" id="s2"><span class="number">3</span>Review the plan</div></div><div class="window"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="label">shop — terminal</span></div><div class="viewport"><div class="content" id="content"></div></div></div><div class="footer"><span>Recorded CLI output from disposable demo databases · pauses shortened</span><span id="caption"></span></div><div class="progress" id="progress"></div><script>
let recording,previousScroll=0;
const clean=s=>s.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,'').replace(/\r/g,'');
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const ansi=s=>{let html='',last=0,style='';const re=/\x1b\[([0-9;]*)m/g;let m;while((m=re.exec(s))){html+='<span style="'+style+'">'+escape(s.slice(last,m.index))+'</span>';for(const code of m[1].split(';')){if(code==='0'||code==='')style='';if(code==='1')style+='font-weight:600;';if(code==='34')style+='color:#0969da;';if(code==='35')style+='color:#8250df;';}last=re.lastIndex;}return html+'<span style="'+style+'">'+escape(s.slice(last))+'</span>';};
window.setRecording=data=>{recording=data};
window.renderFrame=(t,dt)=>{
 const phase=t<18?0:t<23?1:2;
 for(let i=0;i<3;i++)document.getElementById('s'+i).className='step '+(i===phase?'active':i<phase?'done':'');
 let lines;
 if(phase===0){
  const all=clean(recording.wizard).trimEnd().split('\n');
  // Preserve a reading pause before consent and after the baseline completes.
  const count=t<1?5:t<8?Math.floor(5+(t-1)/7*7):t<12?Math.floor(12+(t-8)/4*10):t<15?Math.floor(22+(t-12)/3*(all.length-22)):all.length;
  lines=['$ schemabot init','',...all.slice(0,count)];
  document.getElementById('caption').textContent=t<12?'One guided setup':t<15?'Verify before publishing':'Baseline verified. Ready to edit.';
 }else if(phase===1){
  lines=['schema/shop/users.sql','',...clean(recording.diff).trimEnd().split('\n').slice(2)];
  document.getElementById('caption').textContent='Give email addresses more room.';
 }else{
  lines=['$ schemabot plan -s schema -e development','',...recording.plan.replace(/\r/g,'').trimEnd().split('\n')];
  document.getElementById('caption').textContent='The next change is a plan you can review.';
 }
 const html=lines.map(line=>{
 let cls='';if(line.startsWith('$ '))cls='cmd';else if(line.startsWith('+'))cls='add';else if(line.startsWith('-'))cls='remove';else if(line.includes('Baseline plan: no changes')||line.startsWith('Schema ready'))cls='ok';else if(line.startsWith('@@'))cls='muted';
 return '<div class="'+cls+'">'+(line?ansi(line):' ')+'</div>';
 }).join('');
 const content=document.getElementById('content');content.innerHTML=html;
 const wanted=phase===0?Math.max(0,content.scrollHeight-505):0;
 previousScroll+= (wanted-previousScroll)*(1-Math.pow(.65,dt*12));
 if(phase!==0)previousScroll=0;
 content.style.transform=`translateY(${-Math.round(previousScroll)}px)`;
 document.getElementById('label').textContent=phase===1?'shop — schema/shop/users.sql':'shop — terminal';
 document.getElementById('progress').style.width=((phase+1)/3*1100)+'px';
};
</script></body></html>
