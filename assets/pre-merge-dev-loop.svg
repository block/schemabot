<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 588" role="img" aria-label="The SchemaBot dev loop end to end: iterate locally against the schema file, then ship the schema through the PR: apply to staging and production, merge, then deploy" font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="588" fill="#ffffff"/><defs><marker id="dl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="20" y="20" width="380" height="518" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="210" y="50" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Developer machine: iterate freely</text><rect x="440" y="20" width="488" height="518" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="684" y="50" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">The pull request: apply, then merge</text><g><rect x="44" y="70" width="332" height="58" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="93" font-size="15" font-weight="600" fill="#1c1e21">Edit the declarative schema</text><text x="60" y="114" font-size="13" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">users.sql · <tspan fill="#009400">+ email varchar(255)</tspan></text></g><line x1="210" y1="128" x2="210" y2="150" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="44" y="156" width="332" height="58" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="179" font-size="15" font-weight="600" fill="#1c1e21">The local database converges</text><text x="60" y="200" font-size="13" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">spirit diff → ALTER in place</text></g><line x1="210" y1="214" x2="210" y2="236" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="44" y="242" width="332" height="58" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="265" font-size="15" font-weight="600" fill="#1c1e21">The data-access model regenerates</text><text x="60" y="286" font-size="13" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">ORM or codegen: rebuilt, or checked in</text></g><line x1="210" y1="300" x2="210" y2="322" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="44" y="328" width="332" height="58" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="351" font-size="15" font-weight="600" fill="#1c1e21">Build the feature on the new schema</text><text x="60" y="372" font-size="12" fill="#474e57">the queries, endpoints, and tests that use it</text></g><line x1="210" y1="386" x2="210" y2="408" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><path d="M44 357 L32 357 L32 99 L40 99" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><text x="25" y="228" font-size="12" fill="#474e57" transform="rotate(-90 25 228)" text-anchor="middle">iterate</text><g><rect x="44" y="414" width="332" height="104" rx="10" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="60" y="437" font-size="15" font-weight="600" fill="#1c1e21">Ship the schema</text><rect x="58" y="447" width="304" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="68" y="463" font-size="11.5" fill="#474e57">small, well-encapsulated feature: one PR</text><text x="210" y="483" text-anchor="middle" font-size="11" font-style="italic" fill="#474e57">or</text><rect x="58" y="490" width="304" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="68" y="506" font-size="11.5" fill="#474e57">foreseen to grow: split the schema PR early</text></g><path d="M376 452 L420 452 L420 99 L460 99" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="70" width="440" height="58" rx="10" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="480" y="93" font-size="15" font-weight="600" fill="#1c1e21">Open the PR: SchemaBot posts the plan</text><text x="480" y="115" font-size="12.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">ALTER TABLE `users` ADD COLUMN `email` …</text></g><line x1="684" y1="128" x2="684" y2="152" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="158" width="440" height="36" rx="10" fill="#009400" fill-opacity="0.08" stroke="#009400" stroke-opacity="0.6" /><text x="480" y="181" font-size="13.5" fill="#009400" font-weight="600">✓ approving review<tspan fill="#474e57" font-weight="400">&#160;(with the review gate on)</tspan></text></g><line x1="684" y1="194" x2="684" y2="218" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="224" width="440" height="52" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="480" y="255" font-size="13" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e"><tspan fill="#1c1e21" font-weight="600">you:</tspan> schemabot apply -e staging</text></g><line x1="684" y1="276" x2="684" y2="300" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="306" width="440" height="36" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="480" y="329" font-size="15" font-weight="600" fill="#1c1e21">Optional: try the feature against staging</text></g><line x1="684" y1="342" x2="684" y2="366" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="372" width="440" height="36" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="480" y="395" font-size="13" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e"><tspan fill="#1c1e21" font-weight="600">you:</tspan> schemabot apply -e production</text></g><line x1="684" y1="408" x2="684" y2="432" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="438" width="214" height="30" rx="15" fill="#009400" fill-opacity="0.08" stroke="#009400"/><text x="571" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#009400">✓ check (staging)</text><rect x="690" y="438" width="214" height="30" rx="15" fill="#009400" fill-opacity="0.08" stroke="#009400"/><text x="797" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#009400">✓ check (production)</text></g><line x1="684" y1="468" x2="684" y2="490" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="496" width="440" height="22" rx="11" fill="#009400" fill-opacity="0.12" stroke="#009400"/><text x="684" y="511" text-anchor="middle" font-size="12" font-weight="600" fill="#009400">merge: git records what both environments run</text></g><line x1="684" y1="518" x2="684" y2="540" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dl-arrow)" /><g><rect x="464" y="546" width="440" height="22" rx="11" fill="#3578e5" fill-opacity="0.08" stroke="#3578e5"/><text x="684" y="561" text-anchor="middle" font-size="12" font-weight="600" fill="#3578e5">deploy: the code rolls out; the schema is already live</text></g></svg>
