<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 400" role="img" aria-label="The same tool serves a vibe-coded experiment and a tier-zero fleet. What differs between them is only how much infrastructure carries the work: one binary and a connection string at one end, servers that stay up and hand work between them at the other. The gates are identical at both ends: diff against the live database, lint before anything runs, explicit consent to destroy, and uncertainty never passing. So are the guarantees underneath: one driver per change, state that survives a restart, and a way to stop one. Scale changes the blast radius, not the failure mode." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="400" fill="#ffffff"/><defs><marker id="rg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="56" width="396" height="130" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="218" y="82" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">A vibe-coded experiment</text><rect x="44" y="96" width="348" height="44" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="116" font-size="14.5" font-weight="600" fill="#1c1e21">One database, one environment</text><text x="60" y="133" font-size="11.5" fill="#474e57">one binary, one connection string</text><text x="218" y="166" text-anchor="middle" font-size="12" font-style="italic" fill="#474e57">wants minimal infrastructure</text><rect x="532" y="56" width="396" height="130" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="730" y="82" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">A tier-zero fleet</text><rect x="556" y="96" width="348" height="44" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="572" y="116" font-size="14.5" font-weight="600" fill="#1c1e21">Many databases, promoted in order</text><text x="572" y="133" font-size="11.5" fill="#474e57">servers that stay up, work handed between them</text><text x="730" y="166" text-anchor="middle" font-size="12" font-style="italic" fill="#474e57">wants every lever</text><line x1="428" y1="121" x2="520" y2="121" stroke="#8d949e" stroke-width="1.5" marker-start="url(#rg-arrow)" marker-end="url(#rg-arrow)"/><text x="474" y="110" text-anchor="middle" font-size="11.5" fill="#474e57">one tool</text><line x1="218" y1="186" x2="218" y2="210" stroke="#8d949e" stroke-width="1.5" marker-end="url(#rg-arrow)"/><line x1="730" y1="186" x2="730" y2="210" stroke="#8d949e" stroke-width="1.5" marker-end="url(#rg-arrow)"/><rect x="20" y="216" width="908" height="134" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="474" y="242" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1e21">The gates, identical at both ends</text><rect x="44" y="258" width="203" height="34" rx="17" fill="#3578e5" fill-opacity="0.12" stroke="#3578e5" stroke-opacity="0.55"/><text x="145" y="280" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">diff against the live database</text><rect x="263" y="258" width="203" height="34" rx="17" fill="#3578e5" fill-opacity="0.12" stroke="#3578e5" stroke-opacity="0.55"/><text x="364" y="280" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">lint before anything runs</text><rect x="482" y="258" width="203" height="34" rx="17" fill="#3578e5" fill-opacity="0.12" stroke="#3578e5" stroke-opacity="0.55"/><text x="583" y="280" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">explicit consent to destroy</text><rect x="701" y="258" width="203" height="34" rx="17" fill="#3578e5" fill-opacity="0.12" stroke="#3578e5" stroke-opacity="0.55"/><text x="802" y="280" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">uncertainty never passes</text><text x="474" y="366" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Scale changes the blast radius, not the failure mode.</text></svg>
