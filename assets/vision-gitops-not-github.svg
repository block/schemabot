<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 470" role="img" aria-label="GitOps, not GitHub. Four interfaces sit above one model: a GitHub pull request, the CLI, an API or agent, and a forge that is not built yet. All of them drive the same loop, which reconciles the schema files in version control against the live database by computing and applying a plan, and can introspect an existing database to start from. GitHub is an interface, not a dependency, and anything the pull request can do, the CLI can do." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="470" fill="#ffffff"/><defs><marker id="gg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="52" width="212" height="56" rx="10" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="36" y="76" font-size="14" font-weight="600" fill="#1c1e21">GitHub pull request</text><text x="36" y="95" font-size="11" fill="#474e57">the primary interface</text><rect x="252" y="52" width="212" height="56" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="268" y="76" font-size="14" font-weight="600" fill="#1c1e21">CLI</text><text x="268" y="95" font-size="11" fill="#474e57">equal, never a fallback</text><rect x="484" y="52" width="212" height="56" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="500" y="76" font-size="14" font-weight="600" fill="#1c1e21">API, or an agent</text><text x="500" y="95" font-size="11" fill="#474e57">same commands, no browser</text><rect x="716" y="52" width="212" height="56" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="732" y="76" font-size="14" font-weight="600" fill="#474e57">Another forge, a CI job</text><text x="732" y="95" font-size="11" fill="#474e57">not built; nothing prevents it</text><line x1="126" y1="108" x2="126" y2="140" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><line x1="358" y1="108" x2="358" y2="140" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><line x1="590" y1="108" x2="590" y2="140" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><line x1="822" y1="108" x2="822" y2="140" stroke="#8d949e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#gg-arrow)"/><rect x="20" y="146" width="908" height="212" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="474" y="174" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">The model: reconcile version control against the live database</text><rect x="52" y="192" width="228" height="62" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="68" y="214" font-size="14" font-weight="600" fill="#1c1e21">Schema files</text><text x="68" y="234" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">the desired state, in git</text><rect x="360" y="192" width="228" height="62" rx="10" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="376" y="214" font-size="14" font-weight="600" fill="#1c1e21">The plan</text><text x="376" y="234" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">the DDL that closes the gap</text><rect x="668" y="192" width="228" height="62" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="684" y="214" font-size="14" font-weight="600" fill="#1c1e21">The live database</text><text x="684" y="234" font-size="11.5" fill="#474e57">the actual state</text><line x1="290" y1="223" x2="352" y2="223" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><text x="321" y="212" text-anchor="middle" font-size="10.5" fill="#474e57">diff</text><line x1="598" y1="223" x2="660" y2="223" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><text x="629" y="212" text-anchor="middle" font-size="10.5" fill="#474e57">apply</text><path d="M782 254 L782 300 L166 300 L166 260" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#gg-arrow)"/><text x="474" y="322" text-anchor="middle" font-size="11.5" fill="#474e57">introspect: start from a database that already exists</text><rect x="20" y="374" width="444" height="36" rx="10" fill="#009400" fill-opacity="0.08" stroke="#009400" stroke-opacity="0.6"/><text x="38" y="397" font-size="12" fill="#33383e"><tspan font-weight="600" fill="#009400">GitHub is an interface,</tspan>&#160;not a dependency.</text><rect x="484" y="374" width="444" height="36" rx="10" fill="#009400" fill-opacity="0.08" stroke="#009400" stroke-opacity="0.6"/><text x="502" y="397" font-size="12" fill="#33383e"><tspan font-weight="600" fill="#009400">Anything the PR can do,</tspan>&#160;the CLI can do.</text><text x="474" y="442" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Use the same workflow wherever you build.</text></svg>
