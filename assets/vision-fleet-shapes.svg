<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 470" role="img" aria-label="Knowing every schema and acting at any shape. Three stages: know, using the read API that answers what is live right now, what has ever changed, and what is changing now; analyze, by linting live schemas and grouping findings by rule rather than by database; and act, by dispatching one intent to many targets while each target keeps its own plan, consent, and fail-closed gates and a single stop halts the dispatch. A fleet is one shape among many: one database, many engines, many regions, many organizations, many owners." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="470" fill="#ffffff"/><defs><marker id="fs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="56" width="270" height="228" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="155" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">Know</text><text x="155" y="98" text-anchor="middle" font-size="11" fill="#474e57">one read API, three questions</text><rect x="36" y="110" width="238" height="48" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="52" y="130" font-size="12" font-weight="600" fill="#1c1e21">What is live right now</text><text x="52" y="147" font-size="10.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">pull</text><rect x="36" y="166" width="238" height="48" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="52" y="186" font-size="12" font-weight="600" fill="#1c1e21">What has ever changed</text><text x="52" y="203" font-size="10.5" fill="#474e57">every plan and apply, with its DDL</text><rect x="36" y="222" width="238" height="48" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="52" y="242" font-size="12" font-weight="600" fill="#1c1e21">What is changing now</text><text x="52" y="259" font-size="10.5" fill="#474e57">progress, ETA, per shard</text><line x1="294" y1="190" x2="334" y2="190" stroke="#8d949e" stroke-width="1.5" marker-end="url(#fs-arrow)"/><rect x="338" y="56" width="270" height="228" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="473" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">Analyze</text><text x="473" y="98" text-anchor="middle" font-size="11" fill="#474e57">the rules, run over everything</text><rect x="354" y="110" width="238" height="48" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="370" y="130" font-size="12" font-weight="600" fill="#1c1e21">Lint a live schema</text><text x="370" y="147" font-size="10.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">pull --lint</text><rect x="354" y="166" width="238" height="48" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="370" y="186" font-size="12" font-weight="600" fill="#474e57">Group by rule, not by database</text><text x="370" y="203" font-size="10.5" fill="#474e57">one finding, everywhere it holds</text><rect x="354" y="222" width="238" height="48" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="370" y="242" font-size="12" font-weight="600" fill="#474e57">Turn a finding into an edit</text><text x="370" y="259" font-size="10.5" fill="#474e57">the fix written once, not per database</text><line x1="612" y1="190" x2="652" y2="190" stroke="#8d949e" stroke-width="1.5" marker-end="url(#fs-arrow)"/><rect x="656" y="56" width="270" height="228" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="791" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">Act</text><text x="791" y="98" text-anchor="middle" font-size="11" fill="#474e57">dispatch the fix as changes</text><rect x="672" y="110" width="238" height="48" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="688" y="130" font-size="12" font-weight="600" fill="#1c1e21">One intent, many targets</text><text x="688" y="147" font-size="10.5" fill="#474e57">the change is the unit, not the database</text><rect x="672" y="166" width="238" height="48" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="688" y="186" font-size="12" font-weight="600" fill="#1c1e21">Every target keeps its gates</text><text x="688" y="203" font-size="10.5" fill="#474e57">its own plan, consent, and refusals</text><rect x="672" y="222" width="238" height="48" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="688" y="242" font-size="12" font-weight="600" fill="#1c1e21">One stop halts the dispatch</text><text x="688" y="259" font-size="10.5" fill="#474e57">the blast radius stays bounded</text><rect x="20" y="306" width="908" height="90" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="474" y="332" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">A fleet is one shape, not the shape</text><rect x="44" y="348" width="160" height="32" rx="16" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.5"/><text x="124" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#33383e">one database</text><rect x="218" y="348" width="160" height="32" rx="16" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.5"/><text x="298" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#33383e">many engines</text><rect x="392" y="348" width="160" height="32" rx="16" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.5"/><text x="472" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#33383e">many regions</text><rect x="566" y="348" width="160" height="32" rx="16" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.5"/><text x="646" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#33383e">many organizations</text><rect x="740" y="348" width="160" height="32" rx="16" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.5"/><text x="820" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#33383e">many owners</text><text x="474" y="436" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Understand the fleet and turn what you find into changes ready for review.</text></svg>
