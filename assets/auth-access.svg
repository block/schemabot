<svg xmlns="http://www.w3.org/2000/svg" width="948" height="470" viewBox="0 0 948 470" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Two ways in, access you control</title>
<desc id="desc">GitHub delivers signed webhooks; configured actor and review gates check PR commands. CLI and API callers use OIDC or a trusted proxy, with separate read and write permissions. Authentication can be disabled for local development. Both paths reach SchemaBot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="948" height="470" fill="#fff"/>
<text x="24" y="38" font-size="22" fill="#1c1e21" font-weight="600" text-anchor="start">Two ways in, access you control</text>
<rect x="24" y="64" width="420" height="278" rx="10" fill="#f8f9fa" stroke="#dadde1"/>
<rect x="504" y="64" width="420" height="278" rx="10" fill="#f8f9fa" stroke="#dadde1"/>
<text x="44" y="94" font-size="17" fill="#1c1e21" font-weight="600" text-anchor="start">GitHub pull requests</text>
<text x="422" y="94" font-size="12" fill="#68707c" font-weight="400" text-anchor="end">/webhook</text>
<text x="524" y="94" font-size="17" fill="#1c1e21" font-weight="600" text-anchor="start">CLI, tools, and services</text>
<text x="902" y="94" font-size="12" fill="#68707c" font-weight="400" text-anchor="end">/api/*</text>
<rect x="44" y="114" width="380" height="68" rx="10" fill="#fff" stroke="#dadde1"/>
<text x="60" y="140" font-size="15" fill="#1c1e21" font-weight="600" text-anchor="start">Verify the webhook signature</text>
<text x="60" y="162" font-size="13" fill="#474e57" font-weight="400" text-anchor="start">Confirm the request came from GitHub</text>
<rect x="524" y="114" width="380" height="68" rx="10" fill="#fff" stroke="#dadde1"/>
<text x="540" y="140" font-size="15" fill="#1c1e21" font-weight="600" text-anchor="start">Authenticate the caller</text>
<text x="540" y="162" font-size="13" fill="#474e57" font-weight="400" text-anchor="start">OIDC token or trusted proxy</text>
<path d="M234 182 V207" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M714 182 V207" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44" y="214" width="380" height="74" rx="10" fill="#edf3ff" stroke="#b8cef1"/>
<text x="60" y="241" font-size="15" fill="#1c1e21" font-weight="600" text-anchor="start">Check who can run the command</text>
<text x="60" y="265" font-size="13" fill="#474e57" font-weight="400" text-anchor="start">Configured GitHub grants and PR approval</text>
<rect x="524" y="214" width="380" height="74" rx="10" fill="#edf3ff" stroke="#b8cef1"/>
<text x="540" y="241" font-size="15" fill="#1c1e21" font-weight="600" text-anchor="start">Check what the caller can do</text>
<text x="540" y="265" font-size="13" fill="#474e57" font-weight="400" text-anchor="start">Read access, admin access, or scoped writes</text>
<text x="234" y="319" font-size="12" fill="#68707c" font-weight="400" text-anchor="middle">PR gates depend on your configuration</text>
<text x="714" y="319" font-size="12" fill="#68707c" font-weight="400" text-anchor="middle">Local development can run with auth off</text>
<path d="M234 342 V374 H409" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M714 342 V374 H539" fill="none" stroke="#8d949e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="414" y="352" width="120" height="44" rx="10" fill="#3578e5" stroke="#3578e5"/>
<text x="474" y="380" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">SchemaBot</text>
<text x="474" y="441" font-size="14" fill="#474e57" font-weight="400" text-anchor="middle">GitHub permissions and API permissions are configured separately.</text>
</svg>
