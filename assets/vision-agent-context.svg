<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 484" role="img" aria-label="A declarative schema file is the context an agent needs. On the left, an ordered pile of change scripts: to answer what indexes exist today, an agent has to replay every one of them in order and trust that none half-applied. On the right, one CREATE TABLE file stating the desired state, including a unique key on email and an index on created, where the answer to the same question is to read the file. Without asking anyone, an agent gets the current state from the file, the full history from git log on that same file, and what a proposed change will do from the plan. History is not what you give up by going declarative. The gates never ask which of the two wrote the change." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="484" fill="#ffffff"/><rect x="20" y="46" width="400" height="256" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="220" y="72" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">A pile of ordered steps</text><rect x="36" y="86" width="368" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="50" y="103" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">V1__create_users.sql</text><rect x="36" y="114" width="368" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="50" y="131" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">V2__add_email_column.sql</text><rect x="36" y="142" width="368" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="50" y="159" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">V3__add_email_unique.sql</text><text x="50" y="182" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#8d949e">... 43 more</text><rect x="36" y="192" width="368" height="24" rx="6" fill="#ffffff" stroke="#dadde1"/><text x="50" y="209" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">V47__add_created_index.sql</text><text x="36" y="248" font-size="12" font-weight="600" fill="#1c1e21">What indexes exist right now?</text><text x="36" y="268" font-size="11.5" fill="#474e57">Replay all 47 in order, and trust that</text><text x="36" y="285" font-size="11.5" fill="#474e57">none of them half-applied.</text><rect x="440" y="46" width="488" height="256" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="684" y="72" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">One file, stating the state you want</text><rect x="456" y="86" width="456" height="146" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="472" y="106" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">CREATE&#160;TABLE&#160;users&#160;(</text><text x="472" y="123" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">&#160;&#160;id&#160;&#160;&#160;&#160;&#160;&#160;&#160;BIGINT&#160;UNSIGNED&#160;AUTO_INCREMENT,</text><text x="472" y="140" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">&#160;&#160;email&#160;&#160;&#160;&#160;VARCHAR(255)&#160;NOT&#160;NULL,</text><text x="472" y="157" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">&#160;&#160;created&#160;&#160;TIMESTAMP&#160;NOT&#160;NULL,</text><text x="472" y="174" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">&#160;&#160;PRIMARY&#160;KEY&#160;(id),</text><text x="472" y="191" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#009400">&#160;&#160;UNIQUE&#160;KEY&#160;uniq_email&#160;(email),</text><text x="472" y="208" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#009400">&#160;&#160;KEY&#160;idx_created&#160;(created)</text><text x="472" y="225" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">);</text><text x="456" y="248" font-size="12" font-weight="600" fill="#1c1e21">What indexes exist right now?</text><text x="456" y="268" font-size="11.5" fill="#474e57">Read the file. It is the answer, not a</text><text x="456" y="285" font-size="11.5" fill="#474e57">record of how the answer was reached.</text><rect x="20" y="322" width="908" height="96" rx="14" fill="#009400" fill-opacity="0.08" stroke="#009400" stroke-opacity="0.6"/><text x="474" y="348" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">What an agent gets, without asking anyone</text><rect x="44" y="364" width="260" height="32" rx="16" fill="#ffffff" stroke="#009400" stroke-opacity="0.5"/><text x="174" y="385" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">the state, from the file</text><rect x="344" y="364" width="260" height="32" rx="16" fill="#ffffff" stroke="#009400" stroke-opacity="0.5"/><text x="474" y="385" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">the history, from git log</text><rect x="644" y="364" width="260" height="32" rx="16" fill="#ffffff" stroke="#009400" stroke-opacity="0.5"/><text x="774" y="385" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33383e">what a change will do, from the plan</text><text x="474" y="452" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Give agents the schema, its history, and a clear plan for what comes next.</text></svg>
