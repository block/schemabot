<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 470" role="img" aria-label="Everything underneath will change. MySQL, Vitess, and PostgreSQL are first-class peers, each handled on its own terms rather than through a shared subset, with room for whatever engine comes next. All of them feed one thing that stays fixed: the schema in version control as the desired state, the loop that reconciles it against what is live, and the gates in between covering plan, lint, consent, and failing closed. Engines, forges, agent surfaces, and deployment shapes are all expected to be replaced around that core." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="470" fill="#ffffff"/><defs><marker id="sb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="474" y="34" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Every database, supported on its own terms</text><rect x="20" y="48" width="218" height="62" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="36" y="72" font-size="14" font-weight="600" fill="#1c1e21">MySQL</text><text x="36" y="91" font-size="11" fill="#474e57">Online changes for busy tables</text><rect x="250" y="48" width="218" height="62" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="266" y="72" font-size="14" font-weight="600" fill="#1c1e21">Vitess</text><text x="266" y="91" font-size="11" fill="#474e57">Coordinated changes across shards</text><rect x="480" y="48" width="218" height="62" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="496" y="72" font-size="14" font-weight="600" fill="#1c1e21">PostgreSQL</text><text x="496" y="91" font-size="11" fill="#474e57">Concurrent indexes, short lock waits</text><rect x="710" y="48" width="218" height="62" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="726" y="72" font-size="14" font-weight="600" fill="#474e57">Whatever is next</text><text x="726" y="91" font-size="11" fill="#474e57">New engines, the same safeguards</text><line x1="129" y1="110" x2="129" y2="142" stroke="#8d949e" stroke-width="1.5" marker-end="url(#sb-arrow)"/><line x1="359" y1="110" x2="359" y2="142" stroke="#8d949e" stroke-width="1.5" marker-end="url(#sb-arrow)"/><line x1="589" y1="110" x2="589" y2="142" stroke="#8d949e" stroke-width="1.5" marker-end="url(#sb-arrow)"/><line x1="819" y1="110" x2="819" y2="142" stroke="#8d949e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sb-arrow)"/><rect x="20" y="148" width="908" height="166" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="474" y="176" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1e21">What stays fixed</text><rect x="44" y="192" width="256" height="80" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="60" y="216" font-size="13.5" font-weight="600" fill="#1c1e21">The schema, in git</text><text x="60" y="236" font-size="11.5" fill="#474e57">the desired state, and the only</text><text x="60" y="253" font-size="11.5" fill="#474e57">source of truth there is</text><rect x="346" y="192" width="256" height="80" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="362" y="216" font-size="13.5" font-weight="600" fill="#1c1e21">The loop</text><text x="362" y="236" font-size="11.5" fill="#474e57">reconcile that against what is</text><text x="362" y="253" font-size="11.5" fill="#474e57">actually live, and close the gap</text><rect x="648" y="192" width="256" height="80" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="664" y="216" font-size="13.5" font-weight="600" fill="#1c1e21">The gates</text><text x="664" y="236" font-size="11.5" fill="#474e57">plan, lint, consent, refuse when</text><text x="664" y="253" font-size="11.5" fill="#474e57">the answer is not certain</text><line x1="306" y1="232" x2="340" y2="232" stroke="#8d949e" stroke-width="1.5" marker-end="url(#sb-arrow)"/><line x1="608" y1="232" x2="642" y2="232" stroke="#8d949e" stroke-width="1.5" marker-end="url(#sb-arrow)"/><text x="474" y="294" text-anchor="middle" font-size="11.5" fill="#474e57">Everything else is an implementation of these three, and should be swappable without any of them moving.</text><rect x="20" y="330" width="908" height="96" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="474" y="356" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Assume all of this gets replaced</text><rect x="44" y="372" width="185" height="32" rx="16" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="136" y="393" text-anchor="middle" font-size="11.5" font-weight="600" fill="#474e57">engines</text><rect x="269" y="372" width="185" height="32" rx="16" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="361" y="393" text-anchor="middle" font-size="11.5" font-weight="600" fill="#474e57">forges</text><rect x="494" y="372" width="185" height="32" rx="16" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="586" y="393" text-anchor="middle" font-size="11.5" font-weight="600" fill="#474e57">agent surfaces</text><rect x="719" y="372" width="185" height="32" rx="16" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="811" y="393" text-anchor="middle" font-size="11.5" font-weight="600" fill="#474e57">deployment shapes</text><text x="474" y="452" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Add engines and interfaces without giving up the guarantees.</text></svg>
