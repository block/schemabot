<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 360" role="img" aria-label="The two destructive workflows: hide an index and watch traffic before dropping it; remove all code usage of a column and deploy before the schema drops it" font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="360" fill="#ffffff"/><defs><marker id="dw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="20" y="20" width="908" height="138" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="474" y="48" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Dropping an index: hide it first</text><g><rect x="44" y="64" width="272" height="72" rx="10" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="60" y="88" font-size="15" font-weight="600" fill="#1c1e21">Hide it, don't drop it</text><text x="60" y="108" font-size="12.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">ALTER INDEX … INVISIBLE</text><text x="60" y="126" font-size="12" fill="#474e57">metadata-only: instant and reversible</text></g><line x1="320" y1="100" x2="336" y2="100" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dw-arrow)" /><g><rect x="340" y="64" width="272" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="356" y="88" font-size="15" font-weight="600" fill="#1c1e21">Watch real traffic</text><text x="356" y="108" font-size="12" fill="#474e57">the optimizer stops using it;</text><text x="356" y="126" font-size="12" fill="#474e57">flip it back if queries regress</text></g><line x1="616" y1="100" x2="632" y2="100" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dw-arrow)" /><g><rect x="636" y="64" width="272" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="652" y="88" font-size="15" font-weight="600" fill="#1c1e21">Then drop it from the .sql</text><text x="652" y="108" font-size="12" fill="#474e57">delete the KEY line; the linter</text><text x="652" y="126" font-size="12" fill="#474e57">allows drops of hidden indexes</text></g><rect x="20" y="182" width="908" height="158" rx="14" fill="#f5f6f7" fill-opacity="0.35" stroke="#dadde1" stroke-dasharray="5 5"/><text x="474" y="210" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Dropping a column or table: remove all code usage first</text><g><rect x="44" y="226" width="198" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="60" y="250" font-size="15" font-weight="600" fill="#1c1e21">Remove all usages</text><text x="60" y="270" font-size="12" fill="#474e57">delete the last reads and</text><text x="60" y="288" font-size="12" fill="#474e57">writes; drop it from the model</text></g><line x1="246" y1="262" x2="262" y2="262" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dw-arrow)" /><g><rect x="266" y="226" width="198" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="282" y="250" font-size="15" font-weight="600" fill="#1c1e21">Deploy everywhere</text><text x="282" y="270" font-size="12" fill="#474e57">no running instance still</text><text x="282" y="288" font-size="12" fill="#474e57">references the column</text></g><line x1="468" y1="262" x2="484" y2="262" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dw-arrow)" /><g><rect x="488" y="226" width="198" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="504" y="250" font-size="15" font-weight="600" fill="#1c1e21">Drop it in the .sql</text><text x="504" y="270" font-size="12.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#fa383e">- email varchar(255)</text><text x="504" y="288" font-size="12" fill="#474e57">in its own schema PR</text></g><line x1="690" y1="262" x2="706" y2="262" stroke="#8d949e" stroke-width="1.5" marker-end="url(#dw-arrow)" /><g><rect x="710" y="226" width="198" height="72" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="726" y="250" font-size="15" font-weight="600" fill="#1c1e21">Apply the drop</text><text x="726" y="270" font-size="12.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">apply … --allow-unsafe</text><text x="726" y="288" font-size="12" fill="#474e57">staging → production, merge</text></g><path d="M44 306 L44 311 L464 311 L464 306" fill="none" stroke="#ccd0d5" stroke-width="1" /><text x="254" y="326" text-anchor="middle" font-size="11.5" fill="#474e57">PR 1: code</text><path d="M488 306 L488 311 L908 311 L908 306" fill="none" stroke="#ccd0d5" stroke-width="1" /><text x="698" y="326" text-anchor="middle" font-size="11.5" fill="#474e57">PR 2: schema</text></svg>
