<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 430" role="img" aria-label="Many agents, one database. Four agents each propose a schema change in parallel. All of them pass through one place, which rejects a plan built on a schema that has moved, allows one active apply per deployment, and requires every drive to hold a claim and a lease token. The result is one change applying, the others queued, and one blocked pending consent. No agent negotiates with another; the gate does the coordinating." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="430" fill="#ffffff"/><defs><marker id="ma-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8d949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="140" y="76" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">Agents, in parallel</text><rect x="20" y="90" width="240" height="46" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="36" y="110" font-size="12.5" font-weight="600" fill="#1c1e21">Agent A</text><text x="36" y="127" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">users: + email</text><rect x="20" y="144" width="240" height="46" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="36" y="164" font-size="12.5" font-weight="600" fill="#1c1e21">Agent B</text><text x="36" y="181" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">orders: + index(created_at)</text><rect x="20" y="198" width="240" height="46" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="36" y="218" font-size="12.5" font-weight="600" fill="#1c1e21">Agent C</text><text x="36" y="235" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">users: + phone</text><rect x="20" y="252" width="240" height="46" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="36" y="272" font-size="12.5" font-weight="600" fill="#1c1e21">Agent D</text><text x="36" y="289" font-size="11" font-family="'SFMono-Regular', Menlo, monospace" fill="#33383e">sessions: drop legacy</text><line x1="264" y1="113" x2="296" y2="113" stroke="#8d949e" stroke-width="1.5" marker-end="url(#ma-arrow)"/><line x1="264" y1="167" x2="296" y2="167" stroke="#8d949e" stroke-width="1.5" marker-end="url(#ma-arrow)"/><line x1="264" y1="221" x2="296" y2="221" stroke="#8d949e" stroke-width="1.5" marker-end="url(#ma-arrow)"/><line x1="264" y1="275" x2="296" y2="275" stroke="#8d949e" stroke-width="1.5" marker-end="url(#ma-arrow)"/><rect x="300" y="56" width="340" height="250" rx="14" fill="#3578e5" fill-opacity="0.07" stroke="#3578e5"/><text x="470" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c1e21">One database. One place they all go through.</text><rect x="316" y="94" width="308" height="58" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="332" y="116" font-size="12.5" font-weight="600" fill="#3578e5">Stale plans do not apply</text><text x="332" y="135" font-size="11.5" fill="#474e57">the schema moved, so the plan is refused</text><rect x="316" y="160" width="308" height="58" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="332" y="182" font-size="12.5" font-weight="600" fill="#3578e5">One apply at a time</text><text x="332" y="201" font-size="11.5" fill="#474e57">per database, however many authors there are</text><rect x="316" y="226" width="308" height="58" rx="10" fill="#ffffff" stroke="#3578e5" stroke-opacity="0.4"/><text x="332" y="248" font-size="12.5" font-weight="600" fill="#3578e5">Ownership is provable</text><text x="332" y="267" font-size="11.5" fill="#474e57">every change runs under a claim and a lease</text><line x1="644" y1="113" x2="676" y2="113" stroke="#8d949e" stroke-width="1.5" marker-end="url(#ma-arrow)"/><text x="796" y="76" text-anchor="middle" font-size="13.5" font-weight="600" fill="#474e57">What actually happens</text><rect x="664" y="90" width="264" height="36" rx="10" fill="#009400" fill-opacity="0.08" stroke="#009400"/><text x="680" y="113" font-size="12.5" font-weight="600" fill="#009400">&#9654; applying &#183; Agent B</text><rect x="664" y="136" width="264" height="30" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="680" y="156" font-size="11.5" fill="#474e57">queued &#183; Agent A</text><rect x="664" y="172" width="264" height="30" rx="10" fill="#ffffff" stroke="#dadde1"/><text x="680" y="192" font-size="11.5" fill="#474e57">queued &#183; Agent C</text><rect x="664" y="208" width="264" height="30" rx="10" fill="#ffffff" stroke="#ccd0d5" stroke-dasharray="4 4"/><text x="680" y="228" font-size="11.5" fill="#474e57">blocked &#183; Agent D needs consent</text><rect x="664" y="252" width="264" height="54" rx="10" fill="#f5f6f7" fill-opacity="0.5" stroke="#dadde1"/><text x="680" y="273" font-size="11" fill="#474e57">When B lands, every open change</text><text x="680" y="290" font-size="11" fill="#474e57">whose files no longer match goes red.</text><text x="474" y="366" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">Every agent knows why it’s waiting, what to do next, and when it can continue.</text></svg>
