<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 430" role="img" aria-label="Where your attention goes during a long schema change. Done by hand, the same eight hours of elapsed time are punctuated by six separate demands on a person: writing the ALTER, picking a strategy, booking a window, running it at midnight, watching it for eight hours, and repeating the whole thing in the next environment. With SchemaBot, the elapsed time is identical but almost none of it is yours: you edit the file, choose the swap time, and approve at the start. SchemaBot copies the table, manages load, reports progress, and swaps at the scheduled time when ready. The change still takes eight hours. It stops taking eight hours of your day." font-family="'IBM Plex Sans', -apple-system, sans-serif"><rect width="948" height="430" fill="#ffffff"/><text x="20" y="42" font-size="13.5" font-weight="600" fill="#474e57">By hand</text><text x="88" y="42" font-size="11.5" fill="#8d949e">the same eight hours, and you are needed all the way through</text><rect x="20" y="56" width="908" height="36" rx="8" fill="#f5f6f7" stroke="#dadde1"/><rect x="40" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="190" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="340" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="490" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="640" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="790" y="56" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><text x="67" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">write the</text><text x="67" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">ALTER</text><text x="217" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">pick a</text><text x="217" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">strategy</text><text x="367" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">book a</text><text x="367" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">window</text><text x="517" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">run it at</text><text x="517" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">midnight</text><text x="667" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">watch it for</text><text x="667" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">eight hours</text><text x="817" y="110" text-anchor="middle" font-size="10.5" fill="#474e57">do it again in</text><text x="817" y="124" text-anchor="middle" font-size="10.5" fill="#474e57">the next environment</text><text x="20" y="196" font-size="13.5" font-weight="600" fill="#1c1e21">With SchemaBot</text><text x="156" y="196" font-size="11.5" fill="#8d949e">the same eight hours, and almost none of them yours</text><rect x="20" y="210" width="908" height="36" rx="8" fill="#f5f6f7" stroke="#dadde1"/><rect x="40" y="210" width="54" height="36" rx="8" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><rect x="110" y="210" width="740" height="36" rx="8" fill="#009400" fill-opacity="0.1" stroke="#009400" stroke-opacity="0.5"/><text x="480" y="233" text-anchor="middle" font-size="11.5" font-weight="600" fill="#009400">SchemaBot copies the table, throttles itself, and reports progress</text><rect x="858" y="210" width="54" height="36" rx="8" fill="#009400" fill-opacity="0.1" stroke="#009400" stroke-opacity="0.5"/><text x="67" y="264" text-anchor="middle" font-size="10.5" fill="#474e57">edit the file,</text><text x="67" y="278" text-anchor="middle" font-size="10.5" fill="#474e57">set the time,</text><text x="67" y="292" text-anchor="middle" font-size="10.5" fill="#474e57">say yes</text><text x="480" y="264" text-anchor="middle" font-size="10.5" fill="#474e57">nothing is asked of you, and nothing is waiting on you</text><text x="885" y="264" text-anchor="middle" font-size="10.5" fill="#009400">scheduled swap</text><text x="885" y="278" text-anchor="middle" font-size="10.5" fill="#474e57">when ready</text><rect x="352" y="332" width="14" height="14" rx="4" fill="#3578e5" fill-opacity="0.18" stroke="#3578e5"/><text x="374" y="344" font-size="11.5" fill="#474e57">your time</text><rect x="482" y="332" width="14" height="14" rx="4" fill="#009400" fill-opacity="0.1" stroke="#009400" stroke-opacity="0.5"/><text x="504" y="344" font-size="11.5" fill="#474e57">the machine's time</text><text x="474" y="388" text-anchor="middle" font-size="12.5" font-style="italic" fill="#474e57">An eight-hour change should not take eight hours of your day.</text></svg>
