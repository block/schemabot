name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
  # Required status checks must also report on the merge queue, or the queue
  # waits forever. Inert until a repo admin enables the merge queue.
  merge_group:
permissions:
  contents: read
jobs:
  # See test.yaml for the rationale of this docs-only skip pattern.
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.out.outputs.code }}
    steps:
      - name: "Detect non-docs changes"
        if: github.event_name == 'pull_request'
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # dorny/paths-filter@v3.0.3
        with:
          # The action's default quantifier ORs the patterns, and '**'
          # matches every file, so without 'every' this filter reports
          # code=true on every PR and the docs-only skip never fires.
          # 'every' ANDs them: skip only Markdown, the docs TOC manifest,
          # and documentation images. Keep image exclusions scoped to docs/
          # and assets/ so scripts and Go files there still count as code.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/.toc-manifest'
              - '!{docs,assets}/**/*.{svg,png,jpg,jpeg,gif,webp,ico}'
      - name: "Resolve code-change flag"
        id: out
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [ "$FILTER_OUTCOME" != "success" ]; then
            echo "::warning::paths-filter failed; running CI instead of skipping"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=$FILTER_CODE" >> "$GITHUB_OUTPUT"
          fi

  # The matrix legs below are required status checks on main, so they must
  # report on every PR. A job-level skip would leave the leg names absent on
  # a docs-only PR and the merge waiting on them forever; instead every leg
  # runs, and the steps skip themselves, so the leg reports success in
  # seconds without a checkout or a Go toolchain.
  golangci:
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Only the consumer-module entry sets dir: adding a key to every
          # include entry changes the rendered job names ("lint (default)" →
          # "lint (default, .)"), which breaks the branch-protection required
          # status contexts. Entries without dir lint from the repo root.
          - name: default
            args: ""
          - name: integration
            args: --build-tags=integration
          - name: e2e
            args: --build-tags=e2e ./e2e/...
          # The consumer module has its own go.mod, so root package patterns
          # (./..., ./e2e/...) never reach it; lint it as its own module.
          - name: consumer-module
            args: ""
            dir: e2e/consumermodule
    steps:
      - name: "Docs-only PR: lint has nothing to check"
        if: needs.changes.outputs.code != 'true'
        run: echo "No non-markdown files changed; reporting success so the required check resolves."
      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: golangci-lint (${{ matrix.name }})
        if: needs.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # ratchet:golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.11.4
          args: ${{ matrix.args }}
          working-directory: ${{ matrix.dir || '.' }}
          # The action's built-in config-verify downloads the config JSON
          # schema from golangci-lint.run on every run, so a transient network
          # failure on the runner fails this merge-gating job with no lint
          # findings. Disable it here; the hermetic step below runs the same
          # check against the vendored copy of the schema instead.
          verify: false
      # Expose the pinned golangci-lint binary on PATH for the verify step
      # below via the action's documented install-only contract, instead of
      # relying on the lint step above leaving it there as a side effect.
      - name: golangci-lint (install for config verify)
        if: needs.changes.outputs.code == 'true' && matrix.name == 'default'
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # ratchet:golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.11.4
          install-only: true
      # Validate .golangci.yaml against the vendored schema so the check is
      # hermetic (no remote fetch). The vendored file must be refreshed when
      # the golangci-lint version above moves to a new minor. The hidden
      # --schema flag is removed in v2.12+, which embeds the schema in the
      # binary — on that upgrade, delete this step and the vendored file and
      # re-enable the action's built-in verify.
      - name: golangci-lint config verify (vendored schema)
        if: needs.changes.outputs.code == 'true' && matrix.name == 'default'
        run: golangci-lint config verify --schema .github/golangci.v2.11.jsonschema.json
      - name: webhookheaders analyzer
        if: needs.changes.outputs.code == 'true' && matrix.name == 'default'
        run: make check-webhookheaders
      # The target runs its own default/integration/e2e tag matrix, so it is
      # pinned to one matrix leg rather than repeated per leg.
      - name: closeandlog analyzer
        if: needs.changes.outputs.code == 'true' && matrix.name == 'default'
        run: make check-closeandlog

  # Stable rollup for the lint matrix so a single check name can gate a merge,
  # mirroring the E2E/LocalScale/K8s rollups in test.yaml. The golangci matrix
  # check names (`lint (default)`, `lint (integration, …)`, `lint (e2e, …)`)
  # change with the matrix, so prefer requiring this `Lint` check. While the
  # legs themselves are required, they report on docs-only PRs too (see the
  # golangci job), so either choice resolves.
  lint-rollup:
    name: "Lint"
    needs: [changes, golangci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          GOLANGCI_RESULT: ${{ needs.golangci.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed"
            exit 1
          fi
          if [ "$CHANGES_CODE" != "true" ]; then
            echo "Docs-only PR; lint intentionally skipped."
            exit 0
          fi
          if [ "$GOLANGCI_RESULT" != "success" ]; then
            echo "::error::golangci result=$GOLANGCI_RESULT"
            exit 1
          fi
