name: "Tests"
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
  # Run in the merge queue so the full suite gates merges. Required for the
  # planned PR-smoke / queue-full e2e split. Inert until a repo admin enables
  # the merge queue in branch protection.
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Detect whether the change touches any non-markdown file.
  # PRs that touch only docs skip the heavy jobs below; pushes (main/tags)
  # always run. Fails open: if detection fails, treat as code change.
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.out.outputs.code }}
      full: ${{ steps.out.outputs.full }}
    steps:
      - name: "Detect non-docs changes"
        if: github.event_name == 'pull_request'
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # dorny/paths-filter@v3.0.3
        with:
          # The action's default quantifier ORs the patterns, and '**'
          # matches every file, so without 'every' this filter reports
          # code=true on every PR and the docs-only skip never fires.
          # 'every' ANDs them: skip only Markdown, the docs TOC manifest,
          # and documentation images. Keep image exclusions scoped to docs/
          # and assets/ so scripts and Go files there still count as code.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/.toc-manifest'
              - '!{docs,assets}/**/*.{svg,png,jpg,jpeg,gif,webp,ico}'
      - name: "Resolve code-change and coverage flags"
        id: out
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          PR_SMOKE_ENABLED: ${{ vars.PR_SMOKE_E2E_ENABLED }}
        run: |
          set -euo pipefail
          # code: does this change touch anything other than docs?
          if [ "$EVENT_NAME" != "pull_request" ]; then
            code=true
          elif [ "$FILTER_OUTCOME" != "success" ]; then
            echo "::warning::paths-filter failed; running CI instead of skipping"
            code=true
          else
            code="$FILTER_CODE"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # full: run the complete e2e matrix, or a smoke subset?
          # Always full on push/merge_group (these gate a merge). On a PR, run
          # the smoke subset ONLY when an admin has opted in via the repo
          # variable; any other value fails closed to full PR coverage so the
          # gate cannot be weakened by merging this workflow before the merge
          # queue is enabled.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_SMOKE_ENABLED" = "true" ]; then
            full=false
          else
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME code=$code full=$full (pr_smoke_enabled=${PR_SMOKE_ENABLED:-unset})"

  build:
    name: "Build"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: "Build"
        run: go build -v ./...
      - name: "Vet (all tags)"
        run: |
          go vet ./...
          go vet -tags=integration ./...
          go vet -tags=e2e ./e2e/...
      # Compile (without running) the consumer module's test binary so the
      # saved cache covers its dependency delta — the module resolves newer
      # versions than the root go.sum, which the cache key also hashes.
      - name: "Warm consumer-module cache"
        working-directory: e2e/consumermodule
        run: go test -race -run '^$' ./...
      - name: "Save Go cache"
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}

  unit:
    name: "Unit Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: "Test"
        run: make test-unit
      - name: "Consumer-module startup test"
        run: make test-consumer-module

  integration:
    name: "Integration Tests (${{ matrix.shard }})"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Sized so setup (checkout, Go, cache restore, image prepull — about two
    # minutes) plus go test's own per-binary timeout below can land inside
    # the job budget: a hung binary that starts early in the shard then
    # panics with its goroutine dump instead of the runner cancelling the
    # job first. The Test step's comment covers when that dump is and is not
    # guaranteed.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard names are the answer to "which shard ran my test?", so they
          # name the packages they select rather than describing the split.
          # Each name maps to a selector in the "Test" step below; per-package
          # is derived there as the exact inverse of the dedicated selectors,
          # so the partition cannot drift and an unmapped shard fails loudly.
          #
          # The cross-package suite under ./integration is the longest single
          # shard and cannot be shortened by package parallelism, so it gets its
          # own runner rather than setting the wall time for everything else.
          - shard: ./integration
          # The two dominant per-package binaries (~2 min and ~1.7 min), peeled
          # onto their own runner so the long tail keeps headroom under the job
          # budget.
          - shard: tern-webhook
          # The service package: its storage-backed tests share one MySQL
          # testcontainer and start a PostgreSQL testcontainer each, on top of
          # a large body of unit tests in the same binary. Running it beside
          # other container-heavy binaries contends on the shared Docker
          # daemon, so it keeps an uncontended runner; fold it back into
          # per-package once its wall clock has settled well below the other
          # shards' for a stretch of main runs.
          - shard: pkg/api
          # Every other integration-tagged package: tests that live beside the
          # code they cover, spread across ./pkg, ./cmd and ./e2e. A newly
          # added package is picked up here without touching this file.
          - shard: per-package
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so transient registry outages
      # surface here as a named, retryable, fail-fast step instead of as many
      # parallel testcontainer "context deadline exceeded" test failures.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            mysql:8.0 \
            mysql:8.4 \
            postgres:16 \
            localstack/localstack:3.0 \
            testcontainers/ryuk:0.13.0
      - name: "Test"
        # Cap package-level parallelism: the integration suite runs many heavy
        # MySQL/Spirit package binaries that otherwise thrash CPU and the shared
        # MySQL, starving operator claim loops and causing spurious pending-apply
        # timeouts. Two packages at a time keeps wall time within the job budget.
        #
        # Go's own timeout sits below the job's so a hung test panics with a
        # goroutine dump naming the culprit, instead of the runner cancelling the
        # job and leaving a bare "cancelled" that reads like a plain failure. It
        # is per test binary and starts when that binary does, so the dump is
        # guaranteed only where a binary's own deadline lands inside the job's:
        # one starting late in a long shard can still be cancelled without one.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Dedicated shard selectors, keyed by shard name. per-package greps
          # with the inverse of this map's union, so every integration-tagged
          # package lands in exactly one shard by construction: a new entry
          # here is excluded from per-package automatically, and narrowing or
          # widening a selector moves packages between shards — it can never
          # run one twice or drop one from all of them. The one edge this
          # cannot enforce: an entry here without a matching matrix leg above
          # silently drops its packages from every shard (the reverse, a leg
          # without an entry, fails loudly below) — add both together.
          #
          # ./integration is anchored at the module root so only the top-level
          # cross-package suite takes that shard. A future nested package named
          # `integration` belongs beside the code it covers, in per-package.
          # pkg/tern, pkg/webhook and pkg/api are `$`-anchored so their
          # subpackages stay in per-package.
          declare -A selectors=(
            ["./integration"]='^github\.com/block/schemabot/integration(/|$)'
            ["tern-webhook"]='^github\.com/block/schemabot/pkg/(tern|webhook)$'
            ["pkg/api"]='^github\.com/block/schemabot/pkg/api$'
          )
          if [ "$SHARD" = "per-package" ]; then
            match="-vE"
            selector="($(IFS='|'; echo "${selectors[*]}"))"
          elif [ -n "${selectors[$SHARD]:-}" ]; then
            match="-E"
            selector="${selectors[$SHARD]}"
          else
            echo "::error::shard '$SHARD' has no selector mapping; add one here"
            exit 1
          fi
          all=$(go list -tags=integration ./...)
          set +e
          pkgs=$(printf '%s\n' "$all" | grep -v /localscale | grep "$match" "$selector")
          selector_status=$?
          set -e
          # grep exits 1 when a shard matches nothing and 2 when the selector
          # itself is unusable. Under `set -e` either would abort here with a
          # bare exit status, so both are absorbed and reported apart: a broken
          # selector says so rather than being described as an empty shard.
          if [ "$selector_status" -gt 1 ]; then
            echo "::error::shard '$SHARD' selector $selector is unusable (grep exited $selector_status)"
            exit 1
          fi
          # An empty shard would hand `go test` no packages and silently test the
          # working directory instead, reporting success for work never run.
          if [ -z "$pkgs" ]; then
            echo "::error::shard '$SHARD' selected no packages"
            exit 1
          fi
          # Print the selection so a reader can confirm which shard owns a given
          # test from the log itself, rather than inferring it from the shard
          # name and this file's grep expressions.
          echo "::group::shard '$SHARD' runs $(echo "$pkgs" | wc -l | tr -d ' ') packages"
          echo "$pkgs" | sed 's|^github.com/block/schemabot|.|'
          echo "::endgroup::"
          go test -tags=integration -timeout=8m -count=1 -p=2 $pkgs

  localscale-matrix:
    name: "LocalScale Matrix"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      mode: ${{ steps.gen.outputs.mode }}
      shard_count: ${{ steps.gen.outputs.shard_count }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Generate shard matrix"
        id: gen
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          NUM_SHARDS=3
          # Deterministic order so a test always lands in the same bucket.
          tests=$(grep -h -o 'func Test[^(]*' pkg/localscale/*_test.go | sed 's/func //' | grep -v '/' | sort)
          count=$(printf '%s\n' "$tests" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::no localscale tests discovered"
            exit 1
          fi
          all=$(printf '%s\n' "$tests" | awk -v n="$NUM_SHARDS" '
            { bucket[NR % n] = bucket[NR % n] (bucket[NR % n] ? "|" : "") $0 }
            END { for (i=0; i<n; i++) printf "{\"shard\":\"%d\",\"run_filter\":\"%s\"}\n", i+1, bucket[i] }
          ' | jq -cs '.')
          if [ "$FULL" = "true" ]; then
            shards="$all"
            mode="full"
          else
            # Smoke: one bucket, chosen deterministically per PR so reruns are reproducible.
            idx=$(( PR_NUMBER % NUM_SHARDS ))
            shards=$(printf '%s' "$all" | jq -c "[.[$idx]]")
            mode="smoke"
          fi
          shard_count=$(printf '%s' "$shards" | jq 'length')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          echo "mode=$mode shard_count=$shard_count from $count tests"

  localscale:
    name: "LocalScale Tests (${{ matrix.shard }})"
    needs: [changes, build, localscale-matrix]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.localscale-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so a transient registry outage
      # fails fast in a named, retryable step instead of failing the image
      # build or the testcontainer-based tests below.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            testcontainers/ryuk:0.13.0 \
            --dockerfile deploy/local/Dockerfile.localscale
      - name: "Build LocalScale image"
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o bin/localscale-linux ./cmd/localscale
          docker build -f deploy/local/Dockerfile.localscale -t localscale:latest .
      - name: "Compile tests"
        run: go test -tags=integration -c -o /dev/null ./pkg/localscale/...
      - name: "Test"
        run: go test -tags=integration -timeout=8m -count=1 -v -run "${{ matrix.run_filter }}" ./pkg/localscale/... 2>&1 | tee /dev/stderr | tail -50

  e2e-mysql:
    name: "E2E MySQL Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so a transient registry outage
      # fails fast in a named, retryable step instead of failing the compose
      # image builds or container startup mid-job.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            mysql:8.0 \
            --dockerfile deploy/local/Dockerfile.dev \
            --dockerfile deploy/local/Dockerfile.localscale
      - name: "Test"
        run: make test-e2e-mysql
      - name: "Capture container logs on failure"
        if: failure()
        run: |
          mkdir -p e2e-logs
          # test-e2e-mysql (test-e2e-local) leaves its stack up, so capture it here.
          docker compose -f deploy/e2e/docker-compose.yml logs --no-color --timestamps > e2e-logs/mysql-containers.log 2>&1 || true
          if [ -s e2e-logs/mysql-containers.log ]; then
            echo "=== tail of MySQL container logs (full logs in the uploaded e2e-mysql-logs artifact) ==="
            tail -n 200 e2e-logs/mysql-containers.log || true
          else
            echo "no container logs captured (stack failed before containers started; see the job log above)"
          fi
      - name: "Upload container logs on failure"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: e2e-mysql-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  e2e-grpc:
    name: "E2E gRPC Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so a transient registry outage
      # fails fast in a named, retryable step instead of failing the compose
      # image builds or container startup mid-job.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            mysql:8.0 \
            --dockerfile deploy/local/Dockerfile.dev
      - name: "Test"
        run: make test-e2e-grpc
      - name: "Capture container logs on failure"
        if: failure()
        run: |
          # test-e2e-grpc tears its own stack down, so it captures
          # e2e-logs/grpc-containers.log itself before teardown (test
          # failures and health-wait timeouts). If the target failed before
          # those handlers ran (e.g. a compose build failure), the stack may
          # still be up — capture whatever exists so the artifact is never
          # empty for a diagnosable failure.
          mkdir -p e2e-logs
          if [ ! -f e2e-logs/grpc-containers.log ]; then
            docker compose -p schemabot-e2e-grpc -f deploy/local/docker-compose.grpc.yml logs --no-color --timestamps > e2e-logs/grpc-containers.log 2>&1 || true
          fi
          if [ -s e2e-logs/grpc-containers.log ]; then
            echo "=== tail of gRPC container logs (full logs in the uploaded e2e-grpc-logs artifact) ==="
            tail -n 200 e2e-logs/grpc-containers.log || true
          else
            echo "no container logs captured (stack failed before containers started; see the job log above)"
          fi
      - name: "Upload container logs on failure"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: e2e-grpc-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  e2e-grpc-multideploy:
    name: "E2E gRPC Multi-Deployment Tests (${{ matrix.shard }})"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ordered
            run: TestGRPCMultiDeploy_(SchemaBot_Health|TernHealth_BothDeployments|Plan_FansOut|OrderedCutover|OrderedCutoverObservability|BarrierReleaseBounded)$$
          - shard: failure-policy
            run: TestGRPCMultiDeploy_(FailureHaltsRollout|OnFailureContinue)$$
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so a transient registry outage
      # fails fast in a named, retryable step instead of failing the compose
      # image builds or container startup mid-job.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            mysql:8.0 \
            --dockerfile deploy/local/Dockerfile.dev
      - name: "Test"
        run: make test-e2e-grpc-multideploy E2E_GRPC_MD_RUN='${{ matrix.run }}'
      - name: "Show captured container logs on failure"
        if: failure()
        run: |
          # test-e2e-grpc-multideploy tears its own stack down, so it captures
          # grpc-multideploy-containers.log itself before teardown (test
          # failures and health-wait timeouts). If the target failed before
          # those handlers ran (e.g. a compose build failure), the stack may
          # still be up — capture whatever exists so the artifact is never
          # empty for a diagnosable failure.
          mkdir -p e2e-logs
          if [ ! -f e2e-logs/grpc-multideploy-containers.log ]; then
            docker compose -p schemabot-e2e-grpc-md -f deploy/local/docker-compose.grpc-multideploy.yml logs --no-color --timestamps > e2e-logs/grpc-multideploy-containers.log 2>&1 || true
          fi
          if [ -s e2e-logs/grpc-multideploy-containers.log ]; then
            echo "=== tail of container logs (full logs in the uploaded e2e-grpc-md-logs-shard-${{ matrix.shard }} artifact) ==="
            tail -n 200 e2e-logs/grpc-multideploy-containers.log || true
          else
            echo "no container logs captured (stack failed before containers started; see the job log above)"
          fi
      - name: "Upload container logs on failure"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: e2e-grpc-md-logs-shard-${{ matrix.shard }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  e2e-vitess-matrix:
    name: "E2E Vitess Matrix"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      mode: ${{ steps.gen.outputs.mode }}
      shard_count: ${{ steps.gen.outputs.shard_count }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Generate shard matrix"
        id: gen
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          NUM_SHARDS=3
          # Deterministic order so a test always lands in the same bucket.
          tests=$(grep -o 'func TestVitess_[^(]*' e2e/local/vitess_test.go | sed 's/func //' | sort)
          count=$(printf '%s\n' "$tests" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::no vitess e2e tests discovered"
            exit 1
          fi
          all=$(printf '%s\n' "$tests" | awk -v n="$NUM_SHARDS" '
            { bucket[NR % n] = bucket[NR % n] (bucket[NR % n] ? "|" : "") $0 }
            END { for (i=0; i<n; i++) printf "{\"shard\":\"%d\",\"run_filter\":\"%s\"}\n", i+1, bucket[i] }
          ' | jq -cs '.')
          if [ "$FULL" = "true" ]; then
            shards="$all"
            mode="full"
          else
            # Smoke: one bucket, chosen deterministically per PR so reruns are reproducible.
            idx=$(( PR_NUMBER % NUM_SHARDS ))
            shards=$(printf '%s' "$all" | jq -c "[.[$idx]]")
            mode="smoke"
          fi
          shard_count=$(printf '%s' "$shards" | jq 'length')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          echo "mode=$mode shard_count=$shard_count from $count tests"

  e2e-vitess:
    name: "E2E Vitess Tests (${{ matrix.shard }})"
    needs: [changes, e2e-vitess-matrix]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-vitess-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Pre-pull external images with retries so a transient registry outage
      # fails fast in a named, retryable step instead of failing the compose
      # image builds or container startup mid-job.
      - name: "Pre-pull external images"
        run: |
          scripts/ci/prepull-images.sh \
            mysql:8.0 \
            --dockerfile deploy/local/Dockerfile.dev \
            --dockerfile deploy/local/Dockerfile.localscale
      - name: "Test"
        run: |
          echo "Vitess e2e shard ${{ matrix.shard }}: ${{ matrix.run_filter }}"
          make test-e2e-local RUN="${{ matrix.run_filter }}" E2E_TEST_TIMEOUT=8m E2E_TEST_FLAGS=-v
      - name: "Capture container logs on failure"
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose -f deploy/e2e/docker-compose.yml logs --no-color --timestamps > e2e-logs/containers.log 2>&1 || true
          echo "=== tail of container logs (full logs in the uploaded e2e-vitess-logs-shard-${{ matrix.shard }} artifact) ==="
          tail -n 200 e2e-logs/containers.log || true
      - name: "Upload container logs on failure"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: e2e-vitess-logs-shard-${{ matrix.shard }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
  e2e-k8s:
    name: "E2E K8s Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.full == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    # Sized so setup (checkout, Go, cache restore, minikube start, plus the
    # script's own image build and deploy — about five minutes) plus go
    # test's per-binary timeout inside the script can land inside the job
    # budget: a hung test panics with its goroutine dump instead of the
    # runner cancelling the job first — or, on a slow run, cancelling it
    # during the script's exit-trap cleanup after the suite already passed.
    # Matches the sibling e2e-k8s-etre job's budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: "Start minikube"
        uses: medyagh/setup-minikube@d8c0eb871f6f455542491d86a574477bd3894533 # medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          # The e2e scripts build images through `minikube docker-env`, which
          # only yields a usable Docker daemon under the docker runtime.
          container-runtime: docker
          cpus: 2
          memory: 2048
      # The script builds the schemabot image into minikube's docker daemon
      # under its own per-run tag, so no separate build step is needed here.
      - name: "Deploy and test"
        # Pin the namespace so the failure log dump below reads the same stack
        # the script deployed, and keep it on exit so there is a stack left to
        # read; the runner is ephemeral, so there is nothing to clean up after.
        env:
          E2E_K8S_NAMESPACE: schemabot-e2e
          KEEP_NAMESPACE: "1"
        run: e2e/k8s/e2e-test.sh
      - name: "Pod logs on failure"
        if: failure()
        run: |
          echo "=== Control Plane ==="
          kubectl logs -n schemabot-e2e -l app.kubernetes.io/instance=control-plane --tail=200 2>/dev/null || true
          echo "=== Data Plane ==="
          kubectl logs -n schemabot-e2e -l app.kubernetes.io/instance=data-plane --tail=200 2>/dev/null || true
          echo "=== MySQL Control Plane ==="
          kubectl logs -n schemabot-e2e -l app=mysql-control-plane --tail=50 2>/dev/null || true
          echo "=== MySQL Data Plane ==="
          kubectl logs -n schemabot-e2e -l app=mysql-data-plane --tail=50 2>/dev/null || true
          echo "=== All pods ==="
          kubectl get pods -n schemabot-e2e -o wide 2>/dev/null || true

  e2e-k8s-etre:
    name: "E2E K8s Etre Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.full == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: "Start minikube"
        uses: medyagh/setup-minikube@d8c0eb871f6f455542491d86a574477bd3894533 # medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          # The e2e scripts build images through `minikube docker-env`, which
          # only yields a usable Docker daemon under the docker runtime.
          container-runtime: docker
          cpus: 2
          memory: 4096
      # The script builds both the schemabot and etre images into minikube's
      # docker daemon, so no separate build step is needed here.
      - name: "Deploy and test"
        # Keep the namespace on exit so the failure log dump below can read pod
        # logs; the runner is ephemeral, so there is nothing to clean up after.
        env:
          KEEP_NAMESPACE: "1"
        run: e2e/k8s/e2e-etre-test.sh
      - name: "Pod logs on failure"
        if: failure()
        run: |
          echo "=== Control Plane ==="
          kubectl logs -n schemabot-e2e-etre -l app.kubernetes.io/instance=control-plane-etre --tail=200 2>/dev/null || true
          echo "=== Data Plane ==="
          kubectl logs -n schemabot-e2e-etre -l app.kubernetes.io/instance=data-plane-etre --tail=200 2>/dev/null || true
          echo "=== Etre ==="
          kubectl logs -n schemabot-e2e-etre -l app=etre --tail=100 2>/dev/null || true
          echo "=== ministack ==="
          kubectl logs -n schemabot-e2e-etre -l app=ministack --tail=100 2>/dev/null || true
          echo "=== Seed jobs ==="
          kubectl logs -n schemabot-e2e-etre -l job-name=etre-seed --tail=50 2>/dev/null || true
          kubectl logs -n schemabot-e2e-etre -l job-name=ministack-seed --tail=50 2>/dev/null || true
          echo "=== All pods ==="
          kubectl get pods -n schemabot-e2e-etre -o wide 2>/dev/null || true

  e2e-k8s-vitess:
    name: "E2E K8s Vitess Tests"
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.full == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    # Most of the budget is vtcombo coming up: it initializes a sidecar database
    # per shard of every keyspace the stack declares before the suite can start.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # actions/checkout@v6
      - name: "Configure Go"
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # actions/setup-go@v6.1
        with:
          go-version-file: go.mod
          cache: false
      - name: "Restore Go cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'e2e/consumermodule/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # The runner ships a preinstalled MySQL whose AppArmor profile confines
      # /usr/sbin/mysqld to its packaged data dirs. LocalScale runs vtcombo's
      # embedded mysqld (the same binary path) against a vttest data dir, so the
      # host profile blocks it from reading its own my.cnf and the init aborts.
      # Unload the profile on the runner so the embedded mysqld runs unconfined.
      - name: "Disable host mysqld AppArmor profile"
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/ || true
          fi
      - name: "Start minikube"
        uses: medyagh/setup-minikube@d8c0eb871f6f455542491d86a574477bd3894533 # medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          # The e2e scripts build images through `minikube docker-env`, which
          # only yields a usable Docker daemon under the docker runtime.
          container-runtime: docker
          cpus: 2
          memory: 6144
      # The script builds the schemabot, etre, and localscale images into
      # minikube's docker daemon, so no separate build step is needed here.
      - name: "Deploy and test"
        # Keep the namespace on exit so the failure log dump below can read pod
        # logs; the runner is ephemeral, so there is nothing to clean up after.
        env:
          KEEP_NAMESPACE: "1"
        run: e2e/k8s/e2e-vitess-test.sh
      - name: "Pod logs on failure"
        if: failure()
        run: |
          # The operator's per-tick debug lines and the suite's progress polling
          # fill a short tail on their own, so a deeper window is what keeps the
          # drive that dispatched the work — the part worth reading — in the dump.
          echo "=== Control Plane ==="
          kubectl logs -n schemabot-e2e-vitess -l app.kubernetes.io/instance=control-plane-vitess --tail=3000 2>/dev/null || true
          echo "=== Data Plane ==="
          kubectl logs -n schemabot-e2e-vitess -l app.kubernetes.io/instance=data-plane-vitess --tail=1000 2>/dev/null || true
          echo "=== Etre ==="
          kubectl logs -n schemabot-e2e-vitess -l app=etre --tail=100 2>/dev/null || true
          echo "=== LocalScale ==="
          kubectl logs -n schemabot-e2e-vitess -l app=localscale --tail=200 2>/dev/null || true
          # A restarted LocalScale serves the whole suite connection-refused, and
          # the surviving container's logs show none of it — the reason the first
          # one exited is only in the previous container and the pod's state.
          echo "=== LocalScale (previous container) ==="
          kubectl logs -n schemabot-e2e-vitess -l app=localscale --previous --tail=200 2>/dev/null || true
          echo "=== LocalScale pod state ==="
          kubectl describe pod -n schemabot-e2e-vitess -l app=localscale 2>/dev/null || true
          echo "=== Seed jobs ==="
          kubectl logs -n schemabot-e2e-vitess -l job-name=etre-seed --tail=50 2>/dev/null || true
          echo "=== All pods ==="
          kubectl get pods -n schemabot-e2e-vitess -o wide 2>/dev/null || true

  # Rollup jobs that match the old required check names.
  # Remove these after updating branch protection to use the new job names.
  #
  # On docs-only PRs the upstream jobs are intentionally skipped via the
  # `changes` job; the rollups treat that as success. On any other PR a
  # skipped or failed upstream is treated as failure.
  e2e-rollup:
    name: "E2E Tests"
    needs: [changes, e2e-vitess-matrix, e2e-mysql, e2e-grpc, e2e-grpc-multideploy, e2e-vitess]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ needs.changes.outputs.full }}
          VITESS_MODE: ${{ needs.e2e-vitess-matrix.outputs.mode }}
          VITESS_SHARD_COUNT: ${{ needs.e2e-vitess-matrix.outputs.shard_count }}
          E2E_MYSQL_RESULT: ${{ needs.e2e-mysql.result }}
          E2E_GRPC_RESULT: ${{ needs.e2e-grpc.result }}
          E2E_MULTIDEPLOY_RESULT: ${{ needs.e2e-grpc-multideploy.result }}
          E2E_VITESS_RESULT: ${{ needs.e2e-vitess.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed"
            exit 1
          fi
          if [ "$CHANGES_CODE" != "true" ]; then
            echo "Docs-only PR; E2E intentionally skipped."
            exit 0
          fi
          # Fail closed: a merge-gating event must run the full matrix, and the
          # matrix that was actually instantiated must match the claimed mode.
          # A passing result on a single smoke shard must never gate a merge.
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$FULL" != "true" ]; then
            echo "::error::non-PR event ($EVENT_NAME) must run the full E2E matrix"
            exit 1
          fi
          if [ "$FULL" = "true" ] && [ "$VITESS_SHARD_COUNT" != "3" ]; then
            echo "::error::full E2E expected 3 Vitess shards, got mode=$VITESS_MODE count=$VITESS_SHARD_COUNT"
            exit 1
          fi
          if [ "$FULL" != "true" ] && [ "$VITESS_SHARD_COUNT" != "1" ]; then
            echo "::error::smoke E2E expected 1 Vitess shard, got mode=$VITESS_MODE count=$VITESS_SHARD_COUNT"
            exit 1
          fi
          if [ "$E2E_MYSQL_RESULT" != "success" ]; then
            echo "::error::e2e-mysql result=$E2E_MYSQL_RESULT"
            exit 1
          fi
          if [ "$E2E_GRPC_RESULT" != "success" ]; then
            echo "::error::e2e-grpc result=$E2E_GRPC_RESULT"
            exit 1
          fi
          if [ "$E2E_MULTIDEPLOY_RESULT" != "success" ]; then
            echo "::error::e2e-grpc-multideploy result=$E2E_MULTIDEPLOY_RESULT"
            exit 1
          fi
          if [ "$E2E_VITESS_RESULT" != "success" ]; then
            echo "::error::e2e-vitess result=$E2E_VITESS_RESULT"
            exit 1
          fi

  localscale-rollup:
    name: "LocalScale Tests"
    needs: [changes, localscale-matrix, localscale]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ needs.changes.outputs.full }}
          LS_MODE: ${{ needs.localscale-matrix.outputs.mode }}
          LS_SHARD_COUNT: ${{ needs.localscale-matrix.outputs.shard_count }}
          LOCALSCALE_RESULT: ${{ needs.localscale.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed"
            exit 1
          fi
          if [ "$CHANGES_CODE" != "true" ]; then
            echo "Docs-only PR; LocalScale intentionally skipped."
            exit 0
          fi
          # Fail closed: a merge-gating event must run the full matrix, and the
          # matrix that was actually instantiated must match the claimed mode.
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$FULL" != "true" ]; then
            echo "::error::non-PR event ($EVENT_NAME) must run the full LocalScale matrix"
            exit 1
          fi
          if [ "$FULL" = "true" ] && [ "$LS_SHARD_COUNT" != "3" ]; then
            echo "::error::full LocalScale expected 3 shards, got mode=$LS_MODE count=$LS_SHARD_COUNT"
            exit 1
          fi
          if [ "$FULL" != "true" ] && [ "$LS_SHARD_COUNT" != "1" ]; then
            echo "::error::smoke LocalScale expected 1 shard, got mode=$LS_MODE count=$LS_SHARD_COUNT"
            exit 1
          fi
          if [ "$LOCALSCALE_RESULT" != "success" ]; then
            echo "::error::localscale result=$LOCALSCALE_RESULT"
            exit 1
          fi

  integration-rollup:
    name: "Integration Tests"
    needs: [changes, integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed"
            exit 1
          fi
          if [ "$CHANGES_CODE" != "true" ]; then
            echo "Docs-only PR; integration intentionally skipped."
            exit 0
          fi
          # A matrix result is success only when every shard succeeded, so this
          # cannot pass on a partial run.
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::integration result=$INTEGRATION_RESULT"
            exit 1
          fi

  # Stable rollup for the k8s e2e jobs so a single check name can gate a merge.
  # On a PR running the smoke subset these jobs are intentionally skipped and the
  # full k8s coverage runs on push / in the merge queue; on any merge-gating
  # event all three must succeed.
  k8s-rollup:
    name: "K8s E2E Tests"
    needs: [changes, e2e-k8s, e2e-k8s-etre, e2e-k8s-vitess]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ needs.changes.outputs.full }}
          K8S_RESULT: ${{ needs.e2e-k8s.result }}
          K8S_ETRE_RESULT: ${{ needs.e2e-k8s-etre.result }}
          K8S_VITESS_RESULT: ${{ needs.e2e-k8s-vitess.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed"
            exit 1
          fi
          if [ "$CHANGES_CODE" != "true" ]; then
            echo "Docs-only PR; K8s E2E intentionally skipped."
            exit 0
          fi
          # On a PR running the smoke subset, k8s is deferred to the merge queue.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FULL" != "true" ]; then
            echo "PR smoke run; full K8s E2E deferred to the merge queue."
            exit 0
          fi
          for r in "$K8S_RESULT" "$K8S_ETRE_RESULT" "$K8S_VITESS_RESULT"; do
            if [ "$r" != "success" ]; then
              echo "::error::k8s e2e results: k8s=$K8S_RESULT etre=$K8S_ETRE_RESULT vitess=$K8S_VITESS_RESULT"
              exit 1
            fi
          done
