# Data plane Helm values for the multi-target k8s e2e.
#
# One deployment serves every target of the multi-target environments, each a
# DSID resolved through Etre with credentials read from Secrets Manager, both
# emulated in-cluster. Two replicas so a rollout's operations spread across
# drivers on different pods and survive one pod being deleted.

image:
  repository: schemabot
  tag: test
  pullPolicy: Never

replicaCount: 2

grpc:
  enabled: true
  port: 13370

config:
  storage:
    dsn: "env:MYSQL_DSN"
  target_resolver:
    etre:
      - addr: "http://etre:8080"
        database_type: mysql
        entity_type: aurora_cluster
        target_label: dsid
        env_label: env
        labels:
          aws_region: us-east-1
        mysql:
          host_field: writer_endpoint
          default_port: "3306"
        credentials:
          type: awssm
          region: us-east-1
          role_arn: "arn:aws:iam::{account}:role/tern-assumed"
          secret_name: "{target}_ddl_password"

env:
  - name: MYSQL_DSN
    value: "root:testpassword@tcp(mysql-data-plane:3306)/tern?parseTime=true&multiStatements=true"
  - name: AWS_ENDPOINT_URL
    value: "http://ministack:4566"
  - name: AWS_ACCESS_KEY_ID
    value: "test"
  - name: AWS_SECRET_ACCESS_KEY
    value: "test"
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
  - name: TERN_ENVIRONMENT
    value: "staging"
  - name: LOG_LEVEL
    value: "debug"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
