# gRPC mode, multi-deployment: SchemaBot + two Tern deployments of ONE environment.
#
# This differs from docker-compose.grpc.yml, which wires two Terns as two
# *environments* (staging/production). Here both Terns serve the SAME logical
# environment (staging) but as two distinct *deployments* — `eu` and `us` — each
# with its own MySQL. This is the topology for multi-deployment ordered cutover:
# each deployment copies and parks at the cutover barrier, then cutover runs in
# deployment_order (eu -> us).
#
# Usage:
#   docker-compose -f docker-compose.grpc-multideployment.yml up
#
# Access (default ports):
#   SchemaBot:    http://localhost:13480
#   Tern eu:      http://localhost:13484 (HTTP), localhost:13485 (gRPC)
#   Tern us:      http://localhost:13486 (HTTP), localhost:13487 (gRPC)
#   eu MySQL:     localhost:13482
#   us MySQL:     localhost:13483
name: schemabot-grpc-multideployment

services:
  # =============================================================================
  # Tern deployment: eu
  # =============================================================================
  tern-eu-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: tern
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ./mysql-init/init-tern.sql:/docker-entrypoint-initdb.d/init-tern.sql:ro
      - ./mysql-init/mysql-config/my.cnf:/etc/mysql/conf.d/schemabot.cnf:ro
      - tern-eu-mysql-data:/var/lib/mysql
    ports:
      - "${TERN_EU_MYSQL_PORT:-13482}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  tern-eu:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      MYSQL_DSN: "root:testpassword@tcp(tern-eu-mysql:3306)/tern?parseTime=true&multiStatements=true"
      TERN_TARGET_DSN: "root:testpassword@tcp(tern-eu-mysql:3306)/testapp?parseTime=true&multiStatements=true"
      SCHEMABOT_CONFIG_FILE: "/config/grpc-tern.yaml"
      TERN_ENVIRONMENT: "staging"
      PORT: "8080"
      GRPC_PORT: "9090"
      LOG_LEVEL: "debug"
    volumes:
      - ./config:/config:ro
    ports:
      - "${TERN_EU_PORT:-13484}:8080"
      - "${TERN_EU_GRPC_PORT:-13485}:9090"
    depends_on:
      tern-eu-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================================================
  # Tern deployment: us
  # =============================================================================
  tern-us-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: tern
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ./mysql-init/init-tern.sql:/docker-entrypoint-initdb.d/init-tern.sql:ro
      - ./mysql-init/mysql-config/my.cnf:/etc/mysql/conf.d/schemabot.cnf:ro
      - tern-us-mysql-data:/var/lib/mysql
    ports:
      - "${TERN_US_MYSQL_PORT:-13483}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  tern-us:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      MYSQL_DSN: "root:testpassword@tcp(tern-us-mysql:3306)/tern?parseTime=true&multiStatements=true"
      TERN_TARGET_DSN: "root:testpassword@tcp(tern-us-mysql:3306)/testapp?parseTime=true&multiStatements=true"
      SCHEMABOT_CONFIG_FILE: "/config/grpc-tern.yaml"
      TERN_ENVIRONMENT: "staging"
      PORT: "8080"
      GRPC_PORT: "9090"
      LOG_LEVEL: "debug"
    volumes:
      - ./config:/config:ro
    ports:
      - "${TERN_US_PORT:-13486}:8080"
      - "${TERN_US_GRPC_PORT:-13487}:9090"
    depends_on:
      tern-us-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================================================
  # SchemaBot (control plane)
  # =============================================================================
  schemabot-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: schemabot
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "${SCHEMABOT_MYSQL_PORT:-13481}:3306"
    volumes:
      - ./mysql-init/mysql-config/my.cnf:/etc/mysql/conf.d/schemabot.cnf:ro
      - schemabot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  schemabot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      MYSQL_DSN: "root:testpassword@tcp(schemabot-mysql:3306)/schemabot?parseTime=true&multiStatements=true"
      SCHEMABOT_CONFIG_FILE: "/config/grpc-multideployment-schemabot.yaml"
      PORT: "8080"
      LOG_LEVEL: "debug"
    volumes:
      - ./config:/config:ro
    ports:
      - "${SCHEMABOT_PORT:-13480}:8080"
    depends_on:
      schemabot-mysql:
        condition: service_healthy
      tern-eu:
        condition: service_healthy
      tern-us:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tern-eu-mysql-data:
  tern-us-mysql-data:
  schemabot-mysql-data:
