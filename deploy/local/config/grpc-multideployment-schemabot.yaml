# SchemaBot Configuration (gRPC Mode — multi-deployment SchemaBot server)
#
# Unlike grpc-schemabot.yaml, which wires two Tern services as two *environments*
# (staging/production) of a single `default` deployment, this fixture fans one
# (database, environment) out to TWO deployments — `eu` and `us` — each backed by
# its own remote Tern. The deployments roll out in `deployment_order` and, under
# `cutover_policy: barrier`, each deployment copies and parks at the cutover
# barrier, then cutover runs in order (eu -> us).
#
# This is the topology for the multi-deployment ordered-cutover e2e acceptance
# test. The server enforces a >1-deployment guard until the orchestration path is
# enabled, so this config is exercised by a static topology test rather than a
# live boot today.

# SchemaBot's own storage database
storage:
  dsn: "env:MYSQL_DSN"

databases:
  testapp:
    type: mysql
    environments:
      staging:
        deployments:
          eu:
            target: testapp
          us:
            target: testapp
        deployment_order: ["eu", "us"]
        cutover_policy: barrier

tern_deployments:
  eu:
    staging: "tern-eu:9090"
  us:
    staging: "tern-us:9090"
